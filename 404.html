<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Fig.Feed</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--muted:#7a7a7a;--line:#e7e7e7;--soft:#f4f4f4;--f:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
header{padding:14px max(16px,2.2vw);display:flex;align-items:center;gap:10px}
.logo{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.logo i{width:6px;height:7.5px;background:var(--fg);display:block}
header b{font-weight:600;font-size:15px}
main{min-height:calc(100vh - 66px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,4vw,48px);padding:40px 16px 80px;text-align:center}
.row{display:flex;align-items:center;gap:clamp(12px,2.2vw,36px)}
.word{font-size:clamp(64px,10vw,168px);letter-spacing:-.03em;line-height:1}
.hole{width:clamp(84px,11vw,190px);aspect-ratio:364/478;border:1.5px dashed #bdbdbd;display:grid;place-items:center;color:var(--muted);font-size:clamp(10px,.9vw,13px);padding:8px}
h1{font-size:18px;font-weight:500;margin:0;letter-spacing:-.01em}
p{margin:6px 0 0;color:var(--muted)}
a.pill{display:inline-flex;align-items:center;border-radius:99px;padding:10px 18px;font-weight:500;text-decoration:none;background:var(--fg);color:#fff}
a.pill:hover{opacity:.85}
</style>
</head>
<body>
<header><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><b>Fig.Feed</b></header>
<main>
  <div class="row" aria-hidden="true"><span class="word">4</span><span class="hole">nada aqui</span><span class="word">4</span></div>
  <div><h1>Essa página não existe.</h1><p>O link pode estar errado, ou a página mudou de lugar.</p></div>
  <a class="pill" id="home" href="./">Voltar ao Fig.Feed</a>
</main>
<script>
// No GitHub Pages o site fica em /Nome-do-repositório/, então o botão aponta para lá.
if(location.hostname.endsWith('github.io')){const seg=location.pathname.split('/')[1];if(seg)document.getElementById('home').href='/'+seg+'/'}
</script>
</body>
</html>
