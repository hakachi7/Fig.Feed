<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Fig.Feed</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--muted:#7a7a7a;--line:#e7e7e7;--soft:#f4f4f4;--f:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 16px 90px;text-align:center;position:relative}
.grid{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.grid div{height:70px;background:#d9d9d9 center/cover}
.grid .hole{background:none;border:1px dashed #bdbdbd}
.big{font-size:clamp(64px,8vw,104px);letter-spacing:-.03em;line-height:1;color:var(--muted)}
p{margin:0;color:var(--muted);max-width:380px;line-height:1.5}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
a.pill{display:inline-flex;align-items:center;border-radius:99px;padding:10px 18px;font-weight:500;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:#fff}
a.pill.dark{background:var(--fg);color:#fff;border-color:var(--fg)}
a.pill:hover{opacity:.85}
.tks{position:absolute;left:clamp(16px,4.7vw,68px);bottom:28px;font-size:11px;text-align:left;line-height:1.35}
</style>
</head>
<body>
<main>
  <div class="grid" id="g" aria-hidden="true"></div>
  <div class="big">404</div>
  <p>Essa página sumiu da grade. O endereço que você abriu não existe ou mudou de lugar.</p>
  <div class="acts"><a class="pill dark" id="home" href="./">Voltar para o início</a><a class="pill" id="contas" href="./#contas">Ir para Contas</a></div>
  <div class="tks" aria-hidden="true">tks<br>Fig.Feed</div>
</main>
<script>
// No GitHub Pages o site fica em /Nome-do-repositório/, então os links e as imagens apontam para lá.
let base='./';
if(location.hostname.endsWith('github.io')){const seg=location.pathname.split('/')[1];if(seg)base='/'+seg+'/'}
document.getElementById('home').href=base;document.getElementById('contas').href=base+'#contas';
document.getElementById('g').innerHTML=Array.from({length:9},(_,i)=>i===4?'<div class="hole"></div>':`<div style="background-image:url('${base}img/tutorial/bolinhas-${i+1}.jpg')"></div>`).join('');
</script>
</body>
</html>
