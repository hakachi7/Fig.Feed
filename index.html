/* ======================= V7: Lixeira (30 dias) ======================= */
const DAY=864e5;
const daysAgo=ts=>Math.floor((Date.now()-new Date(ts))/DAY);
const agoTxt=n=>n<=0?'hoje':n===1?'ontem':`há ${n} dias`;
async function moveToTrash(kind,id){await db(sb.from(kind==='conta'?'accounts':'posts').update({deleted_at:new Date().toISOString()}).eq('id',id))}
async function purgeTrash(onlyExpired){
  const {data,error}=await sb.rpc('empty_my_trash',{only_expired:onlyExpired});if(error)throw error;
  const paths=(data||[]).map(x=>typeof x==='string'?x:x?.empty_my_trash).filter(Boolean);
  for(let i=0;i<paths.length;i+=100)await sb.storage.from('fotos').remove(paths.slice(i,i+100));
  return paths.length;
}
async function vLixeira(){
  app.innerHTML=header('')+`<main class="page" style="max-width:820px"><p class="sub">Carregando…</p></main>`;bindHeader();
  let accs=[],posts=[],thumbs={},counts={};
  try{
    await purgeTrash(true).catch(()=>{}); // some sozinho o que passou de 30 dias
    [accs,posts]=await Promise.all([
      db(sb.from('accounts').select('id,handle,avatar_path,deleted_at').not('deleted_at','is',null)),
      db(sb.from('posts').select('id,title,account_id,deleted_at').not('deleted_at','is',null))]);

    const handles={};S.accounts.forEach(a=>handles[a.id]=a.handle);accs.forEach(a=>handles[a.id]=a.handle);

    await signPaths(need);
    var items=[...accs.map(a=>({kind:'conta',id:a.id,t:a.handle,sub:`conta inteira · ${counts[a.id]||0} post${counts[a.id]===1?'':'s'}`,th:a.avatar_path,at:a.deleted_at})),
      ...posts.map(p=>({kind:'post',id:p.id,acc:p.account_id,t:p.title||'Sem título',sub:handles[p.account_id]||'',th:thumbs[p.id],at:p.deleted_at}))]

  }catch(err){if(route[0]==='lixeira')vErro('FF-502');return}
  if(route[0]!=='lixeira')return;

      <small class="left">some em ${left} ${left===1?'dia':'dias'}</small><button class="pill" data-r>Restaurar</button></div>`}).join('')}</div>`
    :`<div class="empty" style="margin:12vh auto 0"><h2>A lixeira está vazia</h2><p>Quando você apagar um post ou uma conta, eles ficam aqui por 30 dias antes de sumir.</p></div>`}</main>`;
  bindHeader();
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const row=b.closest('.tr');b.disabled=true;

      if(it.kind==='post'&&accs.some(a=>a.id===it.acc))await db(sb.from('accounts').update({deleted_at:null}).eq('id',it.acc));

const COTA=1024**3; // 1 GB (plano Grátis do desenho; ajuste quando os planos valerem de verdade)
let libFilter='todas';
const fmtMB=b=>b>=1024**3?(b/1024**3).toFixed(1).replace('.0','').replace('.',',')+' GB':Math.max(1,Math.round(b/1024**2))+' MB';
async function vBiblioteca(){
  app.innerHTML=header('')+`<main class="page lib"><p class="sub">Carregando…</p></main>`;bindHeader();
  let files=[],used={};
  try{const [{data,error},sl]=await Promise.all([sb.rpc('my_files'),db(sb.from('slides').select('storage_path,post_id'))]);if(error)throw error;
    files=(data||[]).filter(f=>!f.name.endsWith('/.emptyFolderPlaceholder'));
    const accOfPost={};S.accounts.forEach(a=>a.posts.forEach(p=>accOfPost[p.id]=a.id));
    sl.forEach(s=>{used[s.storage_path]=accOfPost[s.post_id]||'lixeira'});
    S.accounts.forEach(a=>{if(a.avatar)used[a.avatar]=used[a.avatar]||a.id});if(S.profile.avatar_path)used[S.profile.avatar_path]='perfil';
    await signPaths(files.map(f=>f.name));
  }catch(err){if(route[0]==='biblioteca')vErro('FF-503');return}
  if(route[0]!=='biblioteca')return;
  const total=files.reduce((n,f)=>n+Number(f.size||0),0);
  const accsWith=S.accounts.filter(a=>files.some(f=>used[f.name]===a.id));
  if(libFilter!=='todas'&&libFilter!=='sem-uso'&&!accsWith.some(a=>a.id===libFilter))libFilter='todas';
  const shown=files.filter(f=>libFilter==='todas'||(libFilter==='sem-uso'?!used[f.name]:used[f.name]===libFilter));
  app.innerHTML=header('')+`<main class="page lib"><div class="pg-top"><div><h1>Biblioteca</h1>

/* ======================= V8: Relatório do mês ======================= */
const MESES_RP=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_RP=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const mesLabel=m=>{const[y,mm]=m.split('-');return `${MESES_RP[+mm-1]} ${y}`};
const mesShift=(m,k)=>{const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+k,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
function reportData(a,month,coverUrl){
  const ps=a.posts.filter(p=>p.date&&p.date.startsWith(month));
  const pub=ps.filter(p=>p.status==='publicado').sort((x,y)=>x.date<y.date?-1:1);
  const [y,mm]=month.split('-').map(Number);const days=new Date(y,mm,0).getDate();const nW=Math.ceil(days/7);
  const weeks=Array(nW).fill(0);const wd=Array(7).fill(0);
  pub.forEach(p=>{const d=+p.date.slice(8,10);weeks[Math.min(nW-1,Math.floor((d-1)/7))]++;wd[new Date(p.date+'T12:00').getDay()]++});
  const top=pub.length?wd.indexOf(Math.max(...wd)):-1;
  return {v:1,handle:a.handle,name:a.display_name||'',month,label:mesLabel(month),avatar:coverUrl(accAv(a),120,120),
    total:pub.length,planned:ps.length-pub.length,weeksWith:weeks.filter(Boolean).length,nWeeks:nW,
    perWeek:(pub.length/nW).toFixed(1).replace('.',','),topDay:top<0?'—':DIAS_RP[top],weeks,
    feed:pub.map(p=>({t:p.title,d:p.date,img:coverUrl(p.slides[0],300,375)}))};
}
function reportHTML(r,own){
  const max=Math.max(1,...r.weeks);
  return `<div class="rp-top"><span class="avatar rp-av" style="${r.avatar?`background-image:url('${r.avatar}')`:''}"></span>
      <div><small class="muted">Relatório · ${esc(r.handle)}</small><h1>${esc(r.label)}</h1></div>
      <div class="rp-acts no-print">${own?`<button class="pill" id="rp-prev" aria-label="Mês anterior">‹</button><button class="pill" id="rp-next" aria-label="Próximo mês">›</button><button class="pill" id="rp-link">Copiar link</button>`:''}<button class="pill dark" id="rp-pdf">Baixar PDF</button></div></div>
    <div class="stats rp-stats"><div><b>${r.total}</b><span>posts publicados</span></div><div><b>${r.weeksWith}/${r.nWeeks}</b><span>semanas com post</span></div>
      <div><b>${r.perWeek}</b><span>posts por semana</span></div><div><b>${r.topDay}</b><span>dia mais usado</span></div></div>
    ${own&&r.planned?`<p class="muted no-print" style="margin:-24px 0 30px;font-size:13px">Mais ${r.planned} post${r.planned===1?'':'s'} com data neste mês ainda sem status "Publicado". Só os publicados entram no relatório.</p>`:''}
    <h2 class="sec">Posts por semana</h2>
    <div class="rp-bars" role="img" aria-label="${r.weeks.map((n,i)=>`Semana ${i+1}: ${n}`).join(', ')}">${r.weeks.map((n,i)=>`<div><span class="v">${n}</span><i style="height:${Math.round(n/max*100)}%"></i><small>Sem ${i+1}</small></div>`).join('')}</div>
    <h2 class="sec">Feed do mês</h2>

  return `<dt>Formato</dt><dd class="chips" id="sp-fm">${Object.entries(FORMATOS).map(([k,n])=>`<button class="chip ${fmtOf(p)===k?'on':''}" data-f="${k}" aria-pressed="${fmtOf(p)===k}">${n}</button>`).join('')}</dd>
    <dt>Horário</dt><dd><input type="time" id="sp-h" value="${hhmm(p.hora)}" aria-label="Horário de publicação"></dd>
    <dt>Pilar</dt><dd><select id="sp-p" aria-label="Pilar de conteúdo"><option value="">Sem pilar</option>${[...new Set([...pil,...(p.pilar&&!pil.includes(p.pilar)?[p.pilar]:[])])].map(n=>`<option ${n===p.pilar?'selected':''}>${esc(n)}</option>`).join('')}<option value="__novo">+ Novo pilar…</option></select></dd>
    <dt>Chamada</dt><dd><input id="sp-cta" list="sp-ctas" value="${esc(p.cta||'')}" maxlength="120" placeholder="Ex.: Link na bio" aria-label="Chamada para ação"><datalist id="sp-ctas">${CTAS.map(c=>`<option value="${c}">`).join('')}</datalist></dd>`;
}
function bindPanelExtras(a,p,upd){
  const $=id=>document.getElementById(id);
  $('sp-fm').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;p.formato=b.dataset.f;
    $('sp-fm').querySelectorAll('[data-f]').forEach(x=>{const on=x.dataset.f===p.formato;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});upd({formato:p.formato})};
  $('sp-h').onchange=e=>{p.hora=e.target.value||null;upd({hora:p.hora})};
  $('sp-p').onchange=async e=>{let v=e.target.value;
    if(v==='__novo'){v=(prompt('Nome do novo pilar (ex.: Bastidores):')||'').trim().slice(0,40);
      if(!v){e.target.value=p.pilar||'';return}
      if(!(a.pilares||[]).some(x=>x.name===v)){a.pilares=[...(a.pilares||[]),{name:v,meta:null}];await db(sb.from('accounts').update({pilares:a.pilares}).eq('id',a.id))}
      const o=document.createElement('option');o.textContent=v;e.target.insertBefore(o,e.target.lastElementChild);e.target.value=v}
    p.pilar=v;upd({pilar:v})};
  $('sp-cta').onchange=e=>{p.cta=e.target.value.trim().slice(0,120);upd({cta:p.cta})};
}

/* Downloads: planejamento do mês */
let dlMonth=null;
function planSection(a){
  const pil=a.pilares||[];
  return `<section class="plan-box" aria-labelledby="pl-t"><h2 id="pl-t">Planejamento do mês</h2>
    <label class="lbl-s" for="pl-m">Mês</label><input type="month" id="pl-m" class="field" value="${dlMonth}" style="max-width:220px">
    <label class="lbl-s" for="pl-o">Objetivo do mês <small id="pl-oc"></small></label>
    <textarea id="pl-o" class="field" maxlength="400" rows="3" placeholder="Ex.: lançar o cardápio de verão e aumentar os pedidos pelo direct"></textarea>
    <div class="lbl-s" style="margin-top:18px">Pilares de conteúdo <small>(da conta, valem para todos os meses)</small></div>
    <div id="pl-list">${pil.map((x,i)=>`<div class="pl-row"><input class="field" data-i="${i}" data-k="name" value="${esc(x.name)}" maxlength="40" aria-label="Nome do pilar ${i+1}">
      <input class="field" data-i="${i}" data-k="meta" type="number" min="0" max="100" value="${x.meta??''}" placeholder="meta %" aria-label="Meta do pilar ${i+1} em porcentagem">
      <button class="pill" data-rm="${i}" aria-label="Remover pilar ${esc(x.name)}">${XICON}</button></div>`).join('')||'<p class="muted" style="font-size:13px;margin:6px 0">Nenhum pilar ainda. Exemplos: Produto, Bastidores, Prova social, Dica, Promoção.</p>'}</div>
    <button class="pill" id="pl-add" style="margin-top:8px">+ Adicionar pilar</button>
    <div class="opts"><button class="pill dark" id="pl-pdf">Baixar planejamento (PDF)</button></div></section>`;
}
async function bindPlanSection(a){
  const o=document.getElementById('pl-o'),oc=document.getElementById('pl-oc');
  const cnt=()=>oc.textContent=`(${o.value.length}/400)`;
  o.value=(await getPlan(a.id,dlMonth)).objetivo;cnt();o.oninput=cnt;
  o.onchange=()=>savePlan(a.id,dlMonth,o.value.trim()).then(()=>toast('Objetivo salvo'));
  document.getElementById('pl-m').onchange=e=>{if(e.target.value){dlMonth=e.target.value;vDown()}};
  const savePil=async()=>{await db(sb.from('accounts').update({pilares:a.pilares}).eq('id',a.id));toast('Pilares salvos')};
  document.getElementById('pl-list').onchange=e=>{const t=e.target;if(t.dataset.i==null)return;const x=a.pilares[+t.dataset.i];
    if(t.dataset.k==='name'){const v=t.value.trim();if(!v){t.value=x.name;return}x.name=v}else{const v=t.value===''?null:Math.max(0,Math.min(100,parseInt(t.value,10)||0));x.meta=v}
    savePil()};
  document.getElementById('pl-list').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;a.pilares.splice(+b.dataset.rm,1);savePil().then(vDown)};
  document.getElementById('pl-add').onclick=()=>{const v=(prompt('Nome do pilar (ex.: Bastidores):')||'').trim().slice(0,40);if(!v)return;
    a.pilares=[...(a.pilares||[]),{name:v,meta:null}];savePil().then(vDown)};
  const b=document.getElementById('pl-pdf');
  b.onclick=async()=>{b.disabled=true;const t=b.textContent;b.textContent='Montando o PDF…';
    if(o.value.trim()!==(PLANS[a.id+'|'+dlMonth]?.objetivo||''))await savePlan(a.id,dlMonth,o.value.trim());
    try{await baixarPlanejamento(a,dlMonth)}catch(e){toast('Não foi possível montar o PDF agora')}
    b.disabled=false;b.textContent=t};
}

/* O PDF: monta a página de impressão (A4 deitado) e abre "Salvar como PDF" */
async function baixarPlanejamento(a,month){
  const [y,m]=month.split('-').map(Number),last=new Date(y,m,0).getDate();
  const st=await db(sb.from('stories').select('storage_path,story_date,position,tipo').eq('account_id',a.id)
    .gte('story_date',month+'-01').lte('story_date',`${month}-${String(last).padStart(2,'0')}`).order('story_date').order('position'));
  await signPaths(st.map(s=>s.storage_path));
  const plan=await getPlan(a.id,month);
  const html=planHTML(a,month,plan.objetivo,st);
  document.getElementById('plan-print')?.remove();
  const f=document.createElement('iframe');f.id='plan-print';f.title='Planejamento para imprimir';
  Object.assign(f.style,{position:'fixed',right:'0',bottom:'0',width:'0',height:'0',border:'0'});document.body.appendChild(f);
  const d=f.contentDocument;d.open();d.write(html);d.close();
  await Promise.race([Promise.all([...d.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))),new Promise(r=>setTimeout(r,8000))]);
  if(d.fonts?.ready)await Promise.race([d.fonts.ready,new Promise(r=>setTimeout(r,2000))]);
  toast('Na janela que abrir, escolha "Salvar como PDF"',3500);
  setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print()},300);
}
function planHTML(a,month,objetivo,stories){
  const [y,m]=month.split('-').map(Number);const label=`${MESES_RP[m-1]} ${y}`;
  const ps=a.posts.filter(p=>p.date&&p.date.startsWith(month)).sort((x,z)=>(x.date+(hhmm(x.hora)||'99'))<(z.date+(hhmm(z.hora)||'99'))?-1:1);
  const pic=(s,w,h)=>{const u=s?src(s,w,h):'';return u?`<img src="${u}" alt="">`:'<span class="ph"></span>'};
  const av=pic(accAv(a),80,80),hoje=new Date().toLocaleDateString('pt-BR');
  const ST_={rascunho:['Rascunho','#7a7a7a','#f4f4f4'],pronto:['Pronto','#0a0a0a','#e7e7e7'],agendado:['Agendado','#2f45ff','#eceefe'],publicado:['Publicado','#1e6b3a','#eaf6ee']};
  const chip=s=>{const[t,c,b]=ST_[s]||ST_.rascunho;return `<span class="chip" style="color:${c};background:${b}">${t}</span>`};
  const DS=['dom','seg','ter','qua','qui','sex','sáb'];const wd=d=>DS[new Date(d+'T12:00').getDay()];
  const dd=d=>`${d.slice(8,10)}/${d.slice(5,7)}`;
  const mk=`<svg width="20" height="24" viewBox="0 0 20 24">${[0,1,2].map(r=>[0,1,2].map(c=>`<rect x="${c*7.2}" y="${r*8.6}" width="5.4" height="6.75" fill="#0a0a0a"/>`).join('')).join('')}</svg>`;
  // páginas: 1 visão, 2 calendário, posts em grupos de 12, stories em grupos de 8 dias
  const postPages=[];for(let i=0;i<Math.max(1,ps.length);i+=12)postPages.push(ps.slice(i,i+12));
  const byDay={};stories.forEach(s=>(byDay[s.story_date]=byDay[s.story_date]||[]).push(s));
  const days=Object.keys(byDay).sort();const stPages=[];for(let i=0;i<Math.max(1,days.length);i+=8)stPages.push(days.slice(i,i+8));
  const TOTAL=2+postPages.length+stPages.length;let n=0;
  const page=(title,body)=>{n++;return `<section class="pg"><header><div class="l">${mk}<b>Fig.Feed</b><span class="sep">·</span><span>Planejamento</span></div>
    <div class="r"><span class="av">${av}</span><b>${esc(a.handle)}</b><span class="sep">·</span><b>${label}</b></div></header><h1>${title}</h1>${body}
    <footer><span>Gerado no Fig.Feed em ${hoje}</span><span>${n} / ${TOTAL}</span></footer></section>`};
  // números
  const cnt={rascunho:0,pronto:0,agendado:0,publicado:0};ps.forEach(p=>cnt[p.status]=(cnt[p.status]||0)+1);
  const nW=Math.ceil(new Date(y,m,0).getDate()/7),weeks=Array(nW).fill(0);ps.forEach(p=>weeks[Math.min(nW-1,Math.floor((+p.date.slice(8)-1)/7))]++);
  const fmtCnt={foto:0,carrossel:0,reels:0};ps.forEach(p=>fmtCnt[fmtOf(p)]++);
  const pil=(a.pilares||[]).map(x=>({...x,n:ps.filter(p=>p.pilar===x.name).length}));const semPil=ps.filter(p=>!p.pilar||!pil.some(x=>x.name===p.pilar)).length;
  const pct=k=>ps.length?Math.round(k/ps.length*100):0;
  const pilHTML=pil.length?pil.map(x=>`<div class="pil"><span class="pn">${esc(x.name)}</span><span class="pb"><i style="width:${pct(x.n)}%"></i>${x.meta!=null?`<em style="left:${x.meta}%"></em>`:''}</span><span class="pv">${pct(x.n)}%${x.meta!=null?` <small>meta ${x.meta}%</small>`:''}</span></div>`).join('')+(semPil?`<div class="pil muted"><span class="pn">Sem pilar</span><span class="pb"><i style="width:${pct(semPil)}%;background:#bdbdbd"></i></span><span class="pv">${pct(semPil)}%</span></div>`:'')
    :'<p class="muted" style="font-size:8pt;margin:0">Nenhum pilar definido para esta conta.</p>';
  const grid=[...a.posts].slice(0,12).map(p=>`<div>${pic(p.slides[0],200,250)}${fmtOf(p)!=='foto'?`<i class="${fmtOf(p)}"></i>`:''}</div>`).join('');
  let out=page('Visão do mês',`<div class="g1">
   <div class="phone"><div class="ph-top"><span class="av big">${av}</span><div class="nums"><div><b>${a.posts.length}</b><span>posts</span></div><div><b>${a.followers!=null?Number(a.followers).toLocaleString('pt-BR'):'—'}</b><span>seguidores</span></div><div><b>${a.following!=null?Number(a.following).toLocaleString('pt-BR'):'—'}</b><span>seguindo</span></div></div></div>
    <div class="bio"><b>${esc(a.display_name||a.handle.replace(/^@/,''))}</b>${a.bio?`<br><span class="muted">${esc(a.bio)}</span>`:''}</div>
    <div class="grid3">${grid}</div><div class="cap">Como o feed vai ficar, do post mais novo (em cima) ao mais antigo.</div></div>
   <div><div class="obj"><div class="lab">Objetivo do mês</div><p>${objetivo?esc(objetivo):'<span class="muted">Objetivo ainda não definido.</span>'}</p></div>
    <div class="stats"><div><b>${ps.length}</b><span>posts no mês</span></div><div><b>${fmtCnt.reels}</b><span>Reels</span></div><div><b>${fmtCnt.carrossel}</b><span>carrosséis</span></div><div><b>${stories.length}</b><span>stories</span></div></div>
    <div class="two"><div><div class="lab">Pilares de conteúdo</div>${pilHTML}</div>
     <div><div class="lab">Situação dos posts</div><div class="bar">${['publicado','agendado','pronto','rascunho'].filter(k=>cnt[k]).map(k=>`<i style="flex:${cnt[k]};background:${k==='rascunho'?'#cfcfcf':ST_[k][1]}"></i>`).join('')}</div>
      <div class="legend">${['publicado','agendado','pronto','rascunho'].map(k=>`<span>${chip(k)} ${cnt[k]}</span>`).join('')}</div>
      <div class="lab" style="margin-top:5mm">Posts por semana</div><div class="wk">${weeks.map((w,i)=>`<div><span class="v">${w}</span><i style="height:${w/Math.max(1,...weeks)*100}%"></i><small>Sem ${i+1}</small></div>`).join('')}</div></div></div>
    <div class="approve"><div class="lab">Aprovação do planejamento</div><div class="ap"><span><i class="box"></i>Aprovado como está</span><span><i class="box"></i>Aprovado com ajustes (anotados nas próximas páginas)</span></div>
     <div class="sign"><div>Nome</div><div>Data</div><div>Assinatura</div></div></div></div></div>`);
  // calendário
  const first=new Date(y,m-1,1),lead=(first.getDay()+6)%7,lastD=new Date(y,m,0).getDate();const rows=Math.ceil((lead+lastD)/7);
  const byPostDay={};ps.forEach(p=>(byPostDay[+p.date.slice(8)]=byPostDay[+p.date.slice(8)]||[]).push(p));
  let cells='';for(let i=0;i<rows*7;i++){const d=i-lead+1;if(d<1||d>lastD){cells+='<div class="day off"></div>';continue}
    const ds=`${month}-${String(d).padStart(2,'0')}`,sn=(byDay[ds]||[]).length,list=byPostDay[d]||[];
    cells+=`<div class="day"><div class="dn"><b>${d}</b>${sn?`<span class="st">${sn} ${sn===1?'story':'stories'}</span>`:''}</div>${list.slice(0,2).map(p=>`<div class="pc"><span class="th">${pic(p.slides[0],90,112)}</span><span class="pt"><b>${hhmm(p.hora)||''}</b>${fmtOf(p)==='reels'?' <em>Reels</em>':''}<br>${esc(p.title)}</span></div>`).join('')}${list.length>2?`<small class="more">+${list.length-2}</small>`:''}</div>`}
  out+=page('Calendário',`<div class="cal-h">${['seg','ter','qua','qui','sex','sáb','dom'].map(x=>`<div>${x}</div>`).join('')}</div><div class="cal" style="grid-template-rows:repeat(${rows},1fr)">${cells}</div>`);
  // posts e legendas
  postPages.forEach((grp,gi)=>{out+=page(gi?'Posts e legendas (continuação)':'Posts e legendas',grp.length?`<table class="posts"><thead><tr><th style="width:10mm"></th><th style="width:17mm">Data</th><th style="width:56mm">Post</th><th>Legenda e chamada</th><th style="width:19mm">Situação</th><th style="width:24mm;white-space:nowrap">OK · Ajustar</th></tr></thead><tbody>${
    grp.map(p=>`<tr><td><span class="th2">${pic(p.slides[0],80,100)}</span></td><td><b>${dd(p.date)}</b><br><span class="muted">${wd(p.date)}${p.hora?' · '+hhmm(p.hora):''}</span></td>
      <td><b class="t">${esc(p.title)}</b><br><span class="muted">${fmtLabel(p)}${p.pilar?' · '+esc(p.pilar):''}</span></td>
      <td class="lg">${p.caption?esc(p.caption.length>320?p.caption.slice(0,317)+'…':p.caption):'<span class="muted">Sem legenda ainda.</span>'}${p.cta?`<div class="cta">Chamada: <b>${esc(p.cta)}</b></div>`:''}</td>
      <td>${chip(p.status)}</td><td class="ok"><i class="box"></i><i class="box"></i></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Nenhum post com data neste mês.</p>')});
  // stories e anotações
  stPages.forEach((grp,gi)=>{out+=page(gi?'Stories (continuação)':'Stories e anotações',`<div class="g4"><div class="stories">${grp.length?grp.map(d=>`<div><div class="lab">${wd(d)} · ${dd(d)}</div><div class="srow">${byDay[d].map((s,k)=>`<div class="sx"><span class="si">${pic({path:s.storage_path},90,160)}<em>${k+1}/${byDay[d].length}</em></span><small>${STORY_TIPOS[s.tipo]||'Imagem'}</small></div>`).join('')}</div></div>`).join(''):'<p class="muted" style="font-size:9pt">Nenhum story planejado neste mês.</p>'}</div>
    <div><div class="lab">Anotações e pedidos de ajuste</div><div class="notes">${'<i></i>'.repeat(15)}</div></div></div>`)});
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Planejamento ${esc(a.handle)} ${label}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"><style>${PLAN_CSS}</style></head><body>${out}</body></html>`;
}
const PLAN_CSS=`@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#0a0a0a;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.pg{width:297mm;height:210mm;padding:12mm 14mm 11mm;position:relative;page-break-after:always;break-after:page;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;font-size:9pt;color:#7a7a7a}header .l,header .r{display:flex;align-items:center;gap:6px}header b{color:#0a0a0a;font-weight:600}.sep{color:#bdbdbd}

/* ======================= Início ======================= */
let booted=false;
sb.auth.onAuthStateChange((event,session)=>{
  setTimeout(async()=>{
    if(event==='PASSWORD_RECOVERY'){recovery=true;USER=session?.user||null;go('nova-senha');return}
    if(!booted)return;
    if(event==='SIGNED_IN'&&(!USER||USER.id!==session.user.id)){USER=session.user;app.innerHTML=LOADING;
      try{await loadAll()}catch(e){}
      go(route[0]==='confirmado'?'confirmado':needsTutorial()?'boas-vindas':'home')}
    if(event==='USER_UPDATED'&&session?.user)USER=session.user;
    if(event==='SIGNED_OUT'){USER=null;S={profile:{name:'',handle:'',dates_follow:true},accounts:[]};ADM={users:[],invites:[],log:[],filter:'todos',cat:'todos',loaded:false};go('entrar')}
  },0);
});
/* ======================= Aviso de sem internet ======================= */
function netState(){let n=document.getElementById('net');
  if(navigator.onLine){if(n){n.remove();toast('Conexão de volta')}return}
  if(!n){n=document.createElement('div');n.id='net';n.className='net';n.setAttribute('role','status');
    n.textContent='Sem internet. O que você mudar agora pode não ser salvo.';document.body.appendChild(n)}}
window.addEventListener('online',netState);window.addEventListener('offline',netState);

(async function boot(){
  try{const r=await fetch(`https://picsum.photos/v2/list?page=${1+rnd(8)}&limit=80`);const j=await r.json();if(j.length>20)POOL=j.map(x=>[x.id,x.author])}catch(e){}
  const {data:{session}}=await sb.auth.getSession();USER=session?.user||null;
  let bootErr=null;
  await loadManut();
  if(USER){try{await loadAll()}catch(e){bootErr=e}}
  if(bootErr){booted=true;(!navigator.onLine||/fetch|network/i.test(bootErr.message||''))?vOffline():vErro();return}
  // Chegou pelo link do e-mail?
  const to=h=>history.replaceState(null,'',location.pathname+'#'+h);
  if(LINK.err){authNote='Esse link expirou ou já foi usado. Entre com seu e-mail e senha. Se a conta ainda não foi confirmada, você pode pedir um novo link.';to(USER?'home':'entrar')}
  else if(LINK.type==='signup')to('confirmado');
  else if(LINK.type==='email_change'){to('config');setTimeout(()=>toast('E-mail atualizado'),400)}
  else if(LINK.type!=='recovery'&&USER&&['','#home'].includes(location.hash)&&needsTutorial())to('boas-vindas');
  if(location.search)history.replaceState(null,'',location.pathname+location.hash);
  booted=true;render();netState();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
