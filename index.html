}

/* ======================= Envio de fotos ======================= */
let pickCtx=null;
function pickFiles(ctx){pickCtx=ctx;const f=document.getElementById('file');f.value='';f.click()}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.85)};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
async function uploadSlides(p,files){
  const room=10-p.slides.length;if(files.length>room)toast(`Só cabem mais ${room} foto(s) neste post`);
  files=files.slice(0,Math.max(0,room));if(!files.length)return;
  toast(`Enviando ${files.length} foto(s)…`,20000);
  const blobs=(await Promise.all(files.map(shrink))).filter(Boolean);const rows=[];
  for(const b of blobs){const path=`${USER.id}/${p.id}/${crypto.randomUUID()}.jpg`;
    const {error}=await sb.storage.from('fotos').upload(path,b,{contentType:'image/jpeg'});if(error){toast(traduz(error.message));continue}
    rows.push({post_id:p.id,storage_path:path,credit:(S.profile.handle||'').replace('@','')||null,position:p.slides.length+rows.length})}
  if(!rows.length)return;
  const ins=await db(sb.from('slides').insert(rows).select('id,storage_path,credit'));
  await signPaths(ins.map(r=>r.storage_path));
  p.slides.push(...ins.map(r=>({id:r.id,path:r.storage_path,credit:r.credit})));toast('Fotos enviadas');
}
document.getElementById('file').onchange=async e=>{
  const files=[...e.target.files];if(!files.length||!pickCtx)return;
  if(pickCtx.type==='profavatar'||pickCtx.type==='accavatar'){try{await setAvatar(pickCtx,files[0])}catch(err){}return}
  if(pickCtx.type==='stories'){const c=pickCtx;toast(`Enviando ${files.length} ${files.length===1?'story':'stories'}…`,60000);const rows=[];
    for(const f of files){const b=await shrink(f);if(!b)continue;const path=`${USER.id}/stories/${crypto.randomUUID()}.jpg`;
      const {error}=await sb.storage.from('fotos').upload(path,b,{contentType:'image/jpeg'});if(error){toast(traduz(error.message));continue}
      rows.push({account_id:c.acc,story_date:c.day,storage_path:path,credit:(S.profile.handle||'').replace('@','')||null,position:c.n+rows.length})}
    if(rows.length){await db(sb.from('stories').insert(rows));toast(`${rows.length} ${rows.length===1?'story enviado':'stories enviados'}`)}
    if(route[0]==='stories')vStories();return}
  if(pickCtx.type==='biblioteca'){toast(`Enviando ${files.length} ${files.length===1?'foto':'fotos'}…`,60000);let ok=0;
    for(const f of files){const b=await shrink(f);if(!b)continue;
      const {error}=await sb.storage.from('fotos').upload(`${USER.id}/biblioteca/${crypto.randomUUID()}.jpg`,b,{contentType:'image/jpeg'});
      if(error){toast(traduz(error.message));continue}ok++}
    toast(ok?`${ok} ${ok===1?'foto enviada':'fotos enviadas'}`:'Nenhuma foto foi enviada');libFilter='sem-uso';if(route[0]==='biblioteca')vBiblioteca();return}
  const a=accById(pickCtx.acc);if(!a)return;
  try{
    if(pickCtx.type==='newpost'){const p=await createPost(a);await uploadSlides(p,files);go(`car/${a.id}/${p.id}`)}

  }catch(err){}
};

    case 'titulo':return b.texto?`<h2>${esc(b.texto)}</h2>`:'';
    case 'texto':return b.texto?para(b.texto):'';
    case 'citacao':return b.texto?`<blockquote>${para(b.texto)}</blockquote>`:'';
    case 'foto':return b.path?`<figure><img src="${blogImg(b.path)}" alt="${esc(b.legenda||'')}" style="aspect-ratio:${FMT_RATIO[b.formato]||'16 / 9'}" loading="lazy">${b.legenda?`<figcaption>${esc(b.legenda)}</figcaption>`:''}</figure>`:'';
    case 'galeria':return (b.paths||[]).length?`<div class="bl-gal">${b.paths.map(p=>`<img src="${blogImg(p)}" alt="" style="aspect-ratio:${FMT_RATIO[b.formato]||'4 / 5'}" loading="lazy">`).join('')}</div>`:'';
    case 'gif':return b.path?`<figure class="bl-gif"><img src="${blogImg(b.path)}" alt="${esc(b.legenda||'GIF')}" loading="lazy"><span>GIF</span>${b.legenda?`<figcaption>${esc(b.legenda)}</figcaption>`:''}</figure>`:'';
    case 'video':{const e=videoEmbed(b.url),u=safeUrl(b.url);
      return e?`<div class="bl-vid"><iframe src="${e}" title="Vídeo" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`:(u?`<p><a class="ul" href="${esc(u)}" target="_blank" rel="noopener">Assistir ao vídeo</a></p>`:'')}
    case 'link':{const u=safeUrl(b.url);if(!u)return '';let host='';try{host=new URL(u).hostname.replace(/^www\./,'')}catch(e){}
      return `<a class="bl-link" href="${esc(u)}" target="_blank" rel="noopener"><b>${esc(b.titulo||host||u)}</b>${b.desc?`<span>${esc(b.desc)}</span>`:''}<small>${esc(host)}</small></a>`}
    case 'botao':{const u=safeUrl(b.url);if(!u||!b.texto)return '';
      return `<div class="bl-btn" style="text-align:${{esq:'left',dir:'right'}[b.alinhar]||'center'}"><a class="pill ${b.estilo==='contorno'?'':b.estilo==='texto'?'plain':'dark'}" href="${esc(u)}" ${b.nova===false?'':'target="_blank" rel="noopener"'}>${esc(b.texto)}</a></div>`}
    case 'divisor':return '<hr class="bl-hr">';
    case 'espaco':return '<div style="height:36px" aria-hidden="true"></div>';
    case 'pergunta':return b.titulo?`<details class="bl-faq"><summary>${esc(b.titulo)}</summary>${String(b.texto||'').split(/\n{2,}/).map(t=>`<p>${esc(t).replace(/\n/g,'<br>')}</p>`).join('')}</details>`:'';
    default:return ''}}).join('');
}

async function uploadBlog(file){
  const gif=file.type==='image/gif';let blob=file;
  if(!gif){blob=await shrink(file);if(!blob)throw new Error('Não deu para ler essa imagem.')}
  if(blob.size>10485760)throw new Error('O arquivo passa de 10 MB.');
  const path=`${new Date().toISOString().slice(0,7)}/${crypto.randomUUID()}.${gif?'gif':'jpg'}`;
  const {error}=await sb.storage.from('blog').upload(path,blob,{contentType:gif?'image/gif':'image/jpeg'});if(error)throw error;return path;
}

async function saveBlog(){
  const b=BE;if(!b.title.trim())return toast('Escreva um título.');
  b.slug=slugify(b.slug||b.title);if(!b.slug)return toast('Escolha um endereço para o post.');
  if(b.status==='agendado'&&!b.publish_at)return toast('Escolha a data e a hora do agendamento.');
  const agora=new Date().toISOString();
  const publish_at=b.status==='publicado'?(b.publish_at&&b.publish_at<=agora?b.publish_at:agora):b.publish_at;
  const row={slug:b.slug,title:b.title.trim(),subtitle:(b.subtitle||'').trim(),categoria:b.categoria,cover_path:b.cover_path,cover_format:b.cover_format,blocks:b.blocks,
    resumo:(b.resumo||'').trim(),status:b.status,publish_at,visibilidade:b.visibilidade,em_novidades:!!b.em_novidades,updated_at:agora};

  const {data,error}=await (b.id?sb.from('blog_posts').update(row).eq('id',b.id).select('id').single():sb.from('blog_posts').insert(row).select('id').single());
  if(btn)btn.disabled=false;
  if(error){toast(error.code==='23505'||/duplicate/i.test(error.message)?'Já existe um post com esse endereço. Troque o endereço do post.':traduz(error.message),4200);return}
  b.id=data.id;b.publish_at=publish_at;b.slugMan=true;
  admLog('conteudo','salvou post do blog',{titulo:row.title,status:row.status});
  toast({rascunho:'Rascunho salvo',agendado:'Post agendado',publicado:'Post publicado'}[b.status]);
  history.replaceState(null,'','#admin/blog/'+b.id);route=['admin','blog',b.id];drawBlogEditor();
}

function admPlanPanel(u){

      if(outro&&!(d>=1&&d<=730))return toast('Escolha entre 1 e 730 dias.');

        toast(`${u.name||u.email} agora está no ${PLANO_NOME[pl]}${d?` por ${d} dias`:''}`,3400);

/* ======================= V7: Lixeira (30 dias) ======================= */
const DAY=864e5;
const daysAgo=ts=>Math.floor((Date.now()-new Date(ts))/DAY);
const agoTxt=n=>n<=0?'hoje':n===1?'ontem':`há ${n} dias`;
async function moveToTrash(kind,id){await db(sb.from(kind==='conta'?'accounts':'posts').update({deleted_at:new Date().toISOString()}).eq('id',id))}
async function purgeTrash(onlyExpired){
  const {data,error}=await sb.rpc('empty_my_trash',{only_expired:onlyExpired});if(error)throw error;
  const paths=(data||[]).map(x=>typeof x==='string'?x:x?.empty_my_trash).filter(Boolean);
  for(let i=0;i<paths.length;i+=100)await sb.storage.from('fotos').remove(paths.slice(i,i+100));
  return paths.length;
}
async function vLixeira(){
  app.innerHTML=header('')+`<main class="page" style="max-width:820px"><p class="sub">Carregando…</p></main>`;bindHeader();

    await purgeTrash(true).catch(()=>{}); // some sozinho o que passou de 30 dias
    [accs,posts]=await Promise.all([
      db(sb.from('accounts').select('id,handle,avatar_path,deleted_at').not('deleted_at','is',null)),
      db(sb.from('posts').select('id,title,account_id,deleted_at').not('deleted_at','is',null))]);
    const ids=posts.map(p=>p.id);
    if(ids.length){const sl=await db(sb.from('slides').select('post_id,storage_path,position').in('post_id',ids).order('position'));
      sl.forEach(s=>{if(!thumbs[s.post_id])thumbs[s.post_id]=s.storage_path})}
    if(accs.length){const ps=await db(sb.from('posts').select('account_id').in('account_id',accs.map(a=>a.id)));ps.forEach(p=>counts[p.account_id]=(counts[p.account_id]||0)+1)}
    const handles={};S.accounts.forEach(a=>handles[a.id]=a.handle);accs.forEach(a=>handles[a.id]=a.handle);
    const need=[...Object.values(thumbs),...accs.map(a=>a.avatar_path)].filter(Boolean);
    if(need.length){const {data}=await sb.from('accounts').select('id,handle').in('id',[...new Set(posts.map(p=>p.account_id))].filter(i=>!handles[i]));(data||[]).forEach(a=>handles[a.id]=a.handle)}
    await signPaths(need);
    var items=[...accs.map(a=>({kind:'conta',id:a.id,t:a.handle,sub:`conta inteira · ${counts[a.id]||0} post${counts[a.id]===1?'':'s'}`,th:a.avatar_path,at:a.deleted_at})),
      ...posts.map(p=>({kind:'post',id:p.id,acc:p.account_id,t:p.title||'Sem título',sub:handles[p.account_id]||'',th:thumbs[p.id],at:p.deleted_at}))]
      .sort((x,y)=>new Date(y.at)-new Date(x.at));
  }catch(err){if(route[0]==='lixeira')vErro('FF-502');return}

    ${items.length?`<div class="tr-list">${items.map(it=>{const d=daysAgo(it.at),left=Math.max(0,30-d);return `<div class="tr" data-k="${it.kind}" data-id="${it.id}">

      <small class="left">some em ${left} ${left===1?'dia':'dias'}</small><button class="pill" data-r>Restaurar</button></div>`}).join('')}</div>`
    :`<div class="empty" style="margin:12vh auto 0"><h2>A lixeira está vazia</h2><p>Quando você apagar um post ou uma conta, eles ficam aqui por 30 dias antes de sumir.</p></div>`}</main>`;
  bindHeader();
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const row=b.closest('.tr');b.disabled=true;
    const it=items.find(x=>x.id===row.dataset.id);

      if(it.kind==='post'&&accs.some(a=>a.id===it.acc))await db(sb.from('accounts').update({deleted_at:null}).eq('id',it.acc));
      await loadAll();toast(it.kind==='conta'?'Conta restaurada':'Post restaurado');vLixeira()}catch(e){b.disabled=false}});
  const esv=document.getElementById('esv');
  if(esv)esv.onclick=async()=>{if(!esv.dataset.ok){esv.dataset.ok=1;esv.textContent='Clique de novo para apagar para sempre';return}

const COTA=1024**3; // 1 GB (plano Grátis do desenho; ajuste quando os planos valerem de verdade)

async function vBiblioteca(){
  app.innerHTML=header('')+`<main class="page lib"><p class="sub">Carregando…</p></main>`;bindHeader();
  let files=[],used={};
  try{const [{data,error},sl]=await Promise.all([sb.rpc('my_files'),db(sb.from('slides').select('storage_path,post_id'))]);if(error)throw error;
    files=(data||[]).filter(f=>!f.name.endsWith('/.emptyFolderPlaceholder')&&!f.name.includes('/instagram/'));

    S.accounts.forEach(a=>{if(a.avatar)used[a.avatar]=used[a.avatar]||a.id;(a.highlights||[]).forEach(h=>{if(h&&h.path)used[h.path]=used[h.path]||a.id})});if(S.profile.avatar_path)used[S.profile.avatar_path]='perfil';

    <div class="bar-use" role="img" aria-label="${Math.round(total/COTA*100)}% do espaço usado"><i style="width:${Math.min(100,total/COTA*100).toFixed(1)}%"></i></div>
    <div class="chips lib-chips" role="group" aria-label="Filtrar fotos">${[['todas','Todas'],...accsWith.map(a=>[a.id,a.handle]),['sem-uso','Sem uso']].map(([k,l])=>

    ${shown.length?`<div class="lib-grid">${shown.map(f=>`<button class="lib-it" data-n="${esc(f.name)}" style="background-image:url('${URLS[f.name]||''}')" aria-label="${used[f.name]?'Foto em uso':'Foto sem uso'}">${used[f.name]?'':'<span class="free">sem uso</span>'}</button>`).join('')}</div>`
      :`<div class="empty" style="margin:10vh auto 0"><h2>${files.length?'Nada neste filtro':'Nenhuma foto enviada ainda'}</h2><p>${files.length?'Escolha outro filtro acima.':'As fotos que você envia para posts e as que subir aqui aparecem nesta página.'}</p></div>`}</main>`;
  bindHeader();
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{libFilter=b.dataset.f;vBiblioteca()});
  document.getElementById('lib-up').onclick=()=>pickFiles({type:'biblioteca'});

// Baixa a prévia como imagem PNG (1080 px de largura, como no celular)
async function previaPNG(a,btn){
  btn.disabled=true;const old=btn.textContent;btn.textContent='Montando…';
  try{
    const K=3,W=360*K,P=16*K,F='Inter, "Helvetica Neue", Arial, sans-serif';const hl=hlList(a);const nome=a.display_name||a.handle.replace(/^@/,'');
    const c=document.createElement('canvas');const x=c.getContext('2d');
    const wrap=(t,max,font)=>{x.font=font;const out=[];String(t||'').split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const tt=line?line+' '+w:w;if(x.measureText(tt).width>max&&line){out.push(line);line=w}else line=tt});out.push(line)});return out};
    const fBio=`400 ${13*K}px ${F}`;const bio=a.bio?wrap(a.bio,W-2*P,fBio):[];
    const cell=(W-2*K)/3,cellH=cell*5/4,rows=Math.ceil(a.posts.length/3);
    const yHead=P,avS=86*K,yName=yHead+avS+16*K,yBio=yName+8*K,yHl=yBio+bio.length*19*K+(hl.length?22*K:6*K),hlS=60*K;
    const yTabs=yHl+(hl.length?hlS+34*K:0),yGrid=yTabs+40*K;
    c.width=W;c.height=yGrid+rows*(cellH+2*K)+P;
    x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    const img=async(s,w,h)=>s?loadImg(src(s,w,h)):null;
    const cover=(im,cx,cy,w,h)=>{if(!im)return;const r=Math.max(w/im.width,h/im.height);x.drawImage(im,cx+(w-im.width*r)/2,cy+(h-im.height*r)/2,im.width*r,im.height*r)};
    const circle=async(s,cx,cy,d,letra)=>{x.save();x.beginPath();x.arc(cx+d/2,cy+d/2,d/2,0,Math.PI*2);x.clip();x.fillStyle='#e4e4e4';x.fillRect(cx,cy,d,d);
      const im=await img(s,240,240);if(im)cover(im,cx,cy,d,d);else if(letra){x.fillStyle='#777';x.font=`500 ${d*.38}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.fillText(letra,cx+d/2,cy+d/2);x.textAlign='left';x.textBaseline='alphabetic'}x.restore()};
    await circle(accAv(a),P,yHead,avS);
    const nums=[[fmtNum(a.posts.length),'posts'],[fmtNum(a.followers),'seguidores'],[fmtNum(a.following),'seguindo']];
    const nx=P+avS+22*K,nw=(W-P-nx)/3;x.textAlign='center';
    nums.forEach(([v,l],i)=>{const cx=nx+nw*i+nw/2;x.fillStyle='#0a0a0a';x.font=`600 ${16*K}px ${F}`;x.fillText(v,cx,yHead+avS/2-2*K);x.font=`400 ${13*K}px ${F}`;x.fillText(l,cx,yHead+avS/2+17*K)});
    x.textAlign='left';x.fillStyle='#0a0a0a';x.font=`600 ${13*K}px ${F}`;x.fillText(nome,P,yName);
    x.font=fBio;bio.forEach((l,i)=>x.fillText(l,P,yBio+(i+1)*19*K-4*K));
    for(let i=0;i<hl.length;i++){const hx=P+i*(hlS+14*K);if(hx+hlS>W)break;
      x.strokeStyle='#dbdbdb';x.lineWidth=K;x.beginPath();x.arc(hx+hlS/2,yHl+hlS/2,hlS/2+3*K,0,Math.PI*2);x.stroke();
      await circle(hl[i].path?{path:hl[i].path}:null,hx,yHl,hlS,(hl[i].name||'?')[0].toUpperCase());
      x.fillStyle='#0a0a0a';x.font=`400 ${11*K}px ${F}`;x.textAlign='center';let t=hl[i].name;while(x.measureText(t).width>hlS+12*K&&t.length>1)t=t.slice(0,-1);
      x.fillText(t===hl[i].name?t:t+'…',hx+hlS/2,yHl+hlS+16*K);x.textAlign='left'}
    x.fillStyle='#e7e7e7';x.fillRect(0,yTabs,W,K);x.fillStyle='#0a0a0a';x.fillRect(W/3*0+W/6-30*K,yTabs,60*K,K*1.5);
    x.font=`600 ${12*K}px ${F}`;x.textAlign='center';x.fillText('Posts',W/6,yTabs+26*K);x.fillStyle='#7a7a7a';x.font=`400 ${12*K}px ${F}`;x.fillText('Reels',W/2,yTabs+26*K);x.fillText('Marcados',W*5/6,yTabs+26*K);x.textAlign='left';
    const ims=await Promise.all(a.posts.map(p=>img(p.slides[0],540,675)));
    ims.forEach((im,i)=>{const cx=(i%3)*(cell+K),cy=yGrid+Math.floor(i/3)*(cellH+2*K);x.fillStyle='#d9d9d9';x.fillRect(cx,cy,cell,cellH);x.save();x.beginPath();x.rect(cx,cy,cell,cellH);x.clip();cover(im,cx,cy,cell,cellH);x.restore()});
    await new Promise((res,rej)=>c.toBlob(b=>{if(!b)return rej();saveFile(b,`${a.handle.replace('@','')}-previa.png`);res()},'image/png'));
    toast('Prévia baixada');
  }catch(err){toast('Não deu para gerar a imagem neste navegador.')}
  btn.textContent=old;btn.disabled=false;
}

/* ======================= V8: Relatório do mês ======================= */
const MESES_RP=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_RP=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const mesLabel=m=>{const[y,mm]=m.split('-');return `${MESES_RP[+mm-1]} ${y}`};
const mesShift=(m,k)=>{const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+k,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
function reportData(a,month,coverUrl){
  const ps=a.posts.filter(p=>p.date&&p.date.startsWith(month));
  const pub=ps.filter(p=>p.status==='publicado').sort((x,y)=>x.date<y.date?-1:1);
  const [y,mm]=month.split('-').map(Number);const days=new Date(y,mm,0).getDate();const nW=Math.ceil(days/7);
  const weeks=Array(nW).fill(0);const wd=Array(7).fill(0);
  pub.forEach(p=>{const d=+p.date.slice(8,10);weeks[Math.min(nW-1,Math.floor((d-1)/7))]++;wd[new Date(p.date+'T12:00').getDay()]++});
  const top=pub.length?wd.indexOf(Math.max(...wd)):-1;
  return {v:1,handle:a.handle,name:a.display_name||'',month,label:mesLabel(month),avatar:coverUrl(accAv(a),120,120),
    total:pub.length,planned:ps.length-pub.length,weeksWith:weeks.filter(Boolean).length,nWeeks:nW,
    perWeek:(pub.length/nW).toFixed(1).replace('.',','),topDay:top<0?'—':DIAS_RP[top],weeks,
    feed:pub.map(p=>({t:p.title,d:p.date,img:coverUrl(p.slides[0],300,375)}))};
}
function reportHTML(r,own){
  const max=Math.max(1,...r.weeks);

/* O PDF: monta a página de impressão (A4 deitado) e abre "Salvar como PDF" */
async function baixarPlanejamento(a,month){
  const [y,m]=month.split('-').map(Number),last=new Date(y,m,0).getDate();
  const st=await db(sb.from('stories').select('storage_path,story_date,position,tipo').eq('account_id',a.id)
    .gte('story_date',month+'-01').lte('story_date',`${month}-${String(last).padStart(2,'0')}`).order('story_date').order('position'));
  await signPaths(st.map(s=>s.storage_path));
  const plan=await getPlan(a.id,month);
  const [yy,mm]=month.split('-').map(Number);
  await printDoc(`Planejamento ${a.handle} ${MESES_RP[mm-1]} ${yy}`,planHTML(a,month,plan.objetivo,st,{bodyOnly:true}));
}
function planHTML(a,month,objetivo,stories,opts={}){
  const [y,m]=month.split('-').map(Number);const label=`${MESES_RP[m-1]} ${y}`;
  const ps=a.posts.filter(p=>p.date&&p.date.startsWith(month)).sort((x,z)=>(x.date+(hhmm(x.hora)||'99'))<(z.date+(hhmm(z.hora)||'99'))?-1:1);
  const pic=(s,w,h)=>{const u=s?src(s,w,h):'';return u?`<img src="${u}" alt="">`:'<span class="ph"></span>'};
  const av=pic(accAv(a),80,80),hoje=new Date().toLocaleDateString('pt-BR');
  const ST_={rascunho:['Rascunho','#7a7a7a','#f2f2f2'],pronto:['Pronto','#0a0a0a','#dedede'],agendado:['Agendado','#fff','#6b6b6b'],publicado:['Publicado','#fff','#0a0a0a']};
  const chip=s=>{const[t,c,b]=ST_[s]||ST_.rascunho;return `<span class="chip" style="color:${c};background:${b}">${t}</span>`};
  const DS=['dom','seg','ter','qua','qui','sex','sáb'];const wd=d=>DS[new Date(d+'T12:00').getDay()];
  const dd=d=>`${d.slice(8,10)}/${d.slice(5,7)}`;
  const mk=`<svg width="20" height="24" viewBox="0 0 20 24">${[0,1,2].map(r=>[0,1,2].map(c=>`<rect x="${c*7.2}" y="${r*8.6}" width="5.4" height="6.75" fill="#0a0a0a"/>`).join('')).join('')}</svg>`;
  // páginas: 1 visão, 2 calendário, posts em grupos de 12, stories em grupos de 8 dias
  const postPages=[];for(let i=0;i<Math.max(1,ps.length);i+=12)postPages.push(ps.slice(i,i+12));
  const byDay={};stories.forEach(s=>(byDay[s.story_date]=byDay[s.story_date]||[]).push(s));
  const days=Object.keys(byDay).sort();const stPages=[];for(let i=0;i<Math.max(1,days.length);i+=8)stPages.push(days.slice(i,i+8));
  const TOTAL=(opts.noCover?5:6)+postPages.length+stPages.length;let n=0;
  const page=(title,body,cls='')=>{n++;return `<section class="pg ${cls}"><header><div class="l">${mk}<b>Fig.Feed</b><span class="sep">·</span><span>Planejamento</span></div>
    <div class="r"><span class="av">${av}</span><b>${esc(a.handle)}</b><span class="sep">·</span><b>${label}</b></div></header><h1>${title}</h1>${body}
    <footer><span>Gerado no Fig.Feed em ${hoje}</span><span>${n} / ${TOTAL}</span></footer></section>`};
  // números
  const cnt={rascunho:0,pronto:0,agendado:0,publicado:0};ps.forEach(p=>cnt[p.status]=(cnt[p.status]||0)+1);
  const nW=Math.ceil(new Date(y,m,0).getDate()/7),weeks=Array(nW).fill(0);ps.forEach(p=>weeks[Math.min(nW-1,Math.floor((+p.date.slice(8)-1)/7))]++);
  const fmtCnt={foto:0,carrossel:0,reels:0};ps.forEach(p=>fmtCnt[fmtOf(p)]++);
  const pil=(a.pilares||[]).map(x=>({...x,n:ps.filter(p=>p.pilar===x.name).length}));const semPil=ps.filter(p=>!p.pilar||!pil.some(x=>x.name===p.pilar)).length;
  const pct=k=>ps.length?Math.round(k/ps.length*100):0;
  const pilHTML=pil.length?pil.map(x=>`<div class="pil"><span class="pn">${esc(x.name)}</span><span class="pb"><i style="width:${pct(x.n)}%"></i>${x.meta!=null?`<em style="left:${x.meta}%"></em>`:''}</span><span class="pv">${pct(x.n)}%${x.meta!=null?` <small>meta ${x.meta}%</small>`:''}</span></div>`).join('')+(semPil?`<div class="pil muted"><span class="pn">Sem pilar</span><span class="pb"><i style="width:${pct(semPil)}%;background:#bdbdbd"></i></span><span class="pv">${pct(semPil)}%</span></div>`:'')
    :'<p class="muted" style="font-size:8pt;margin:0">Nenhum pilar definido para esta conta.</p>';
  const grid=[...a.posts].slice(0,12).map(p=>`<div>${pic(p.slides[0],200,250)}${fmtOf(p)!=='foto'?`<i class="${fmtOf(p)}"></i>`:''}</div>`).join('');
  // V13: capa no estilo da página inicial (Fig. · foto · Feed)
  const capaP=ps.find(p=>p.slides[0])||a.posts.find(p=>p.slides[0]);
  let out='';if(!opts.noCover){n++;out=`<section class="pg capa"><div class="cv"><div class="w">Fig.</div><div class="im">${pic(capaP?.slides[0],728,956)}</div><div class="w">Feed</div></div>
    <div class="cv-f"><span class="who"><span class="av">${av}</span><b>${esc(a.handle)}</b><span class="sep">·</span>Planejamento de ${label}</span><span>Gerado no Fig.Feed em ${hoje} · ${n} / ${TOTAL}</span></div></section>`}
  if(opts.onlyCover)return out;
  out+=page('Visão do mês',`<div class="g1">
   <div class="phone"><div class="ph-top"><span class="av big">${av}</span><div class="nums"><div><b>${a.posts.length}</b><span>posts</span></div><div><b>${a.followers!=null?Number(a.followers).toLocaleString('pt-BR'):'—'}</b><span>seguidores</span></div><div><b>${a.following!=null?Number(a.following).toLocaleString('pt-BR'):'—'}</b><span>seguindo</span></div></div></div>
    <div class="bio"><b>${esc(a.display_name||a.handle.replace(/^@/,''))}</b>${a.bio?`<br><span class="muted">${esc(a.bio)}</span>`:''}</div>
    <div class="grid3">${grid}</div><div class="cap">Como o feed vai ficar, do post mais novo (em cima) ao mais antigo.</div></div>
   <div><div class="obj"><div class="lab">Objetivo do mês</div><p>${objetivo?esc(objetivo):'<span class="muted">Objetivo ainda não definido.</span>'}</p></div>
    <div class="stats"><div><b>${ps.length}</b><span>posts no mês</span></div><div><b>${fmtCnt.reels}</b><span>Reels</span></div><div><b>${fmtCnt.carrossel}</b><span>carrosséis</span></div><div><b>${stories.length}</b><span>stories</span></div></div>
    <div class="two"><div><div class="lab">Pilares de conteúdo</div>${pilHTML}</div>
     <div><div class="lab">Situação dos posts</div><div class="bar">${['publicado','agendado','pronto','rascunho'].filter(k=>cnt[k]).map(k=>`<i style="flex:${cnt[k]};background:${k==='rascunho'?'#e3e3e3':ST_[k][2]}"></i>`).join('')}</div>
      <div class="legend">${['publicado','agendado','pronto','rascunho'].map(k=>`<span>${chip(k)} ${cnt[k]}</span>`).join('')}</div>
      <div class="lab" style="margin-top:5mm">Posts por semana</div><div class="wk">${weeks.map((w,i)=>`<div><span class="v">${w}</span><i style="height:${w/Math.max(1,...weeks)*100}%"></i><small>Sem ${i+1}</small></div>`).join('')}</div></div></div>
    <div class="approve"><div class="lab">Aprovação do planejamento</div><div class="ap"><span><i class="box"></i>Aprovado como está</span><span><i class="box"></i>Aprovado com ajustes (anotados nas próximas páginas)</span></div>
     <div class="sign"><div>Nome</div><div>Data</div><div>Assinatura</div></div></div></div></div>`);
  // V13: mood feed (3ª página) — cartões no visual do Instagram com as fotos da conta
  const moodSrc=[...ps,...a.posts.filter(p=>!ps.includes(p))].filter(p=>p.slides[0]);
  // cada post aparece uma vez; se faltar post, completa com os fundos de bolinhas do Fig.Feed
  const bol=i=>`<img src="${new URL(TUT_IMG[i%TUT_IMG.length],location.href).href}" alt="">`;
  const card=(p,k)=>`<div class="ig"><div class="ig-h"><span class="av">${av}</span><b>${esc(a.handle.replace(/^@/,''))}</b><span class="dots">···</span></div><div class="ig-i">${p?pic(p.slides[0],400,500):bol(k)}${p&&fmtOf(p)==='carrossel'?'<i class="mc"></i>':''}${p&&fmtOf(p)==='reels'?'<i class="mr"></i>':''}</div></div>`;
  const OFF=[-26,4,-40,-8,-30];let mi=0,bi=0;
  const moodCols=OFF.map((o,c)=>`<div class="mcol" style="margin-top:${o}mm">${[0,1,2].map(()=>mi<moodSrc.length?card(moodSrc[mi++]):card(null,bi++)).join('')}</div>`).join('');
  out+=page('Mood do feed',`<div class="side">${esc(a.handle)} · Mood do feed · ${label}</div><div class="mood">${moodCols}</div>`,'dk');

/* Junta os dados do mês e calcula tudo o que a tela e o PDF mostram */
async function igLoad(a,month){

  const [conn,daily,monthly,media,aud]=await Promise.all([igConn(a.id,true),
    db(sb.from('ig_daily').select('*').eq('account_id',a.id).gte('day',ini).lte('day',fim).order('day')),
    sb.from('ig_monthly').select('*').eq('account_id',a.id).eq('month',month).maybeSingle().then(r=>r.data),
    db(sb.from('ig_media').select('*').eq('account_id',a.id).gte('ts',tIni).lt('ts',tFim).order('ts')),
    db(sb.from('ig_audience').select('*').eq('account_id',a.id))]);
  await signPaths(media.map(x=>x.thumb_url).filter(Boolean));
  const posts=media.filter(x=>x.kind!=='story').map(x=>({...x,dt:new Date(x.ts),eng:x.reach?((x.total_interactions??((x.likes||0)+(x.comments||0)+(x.saved||0)+(x.shares||0)))/x.reach*100):null}));
  const stories=media.filter(x=>x.kind==='story').map(x=>({...x,dt:new Date(x.ts)}));
  const sum=k=>daily.reduce((s,d)=>s+(d[k]||0),0),has=k=>daily.some(d=>d[k]!=null);
  const pSum=k=>posts.reduce((s,p)=>s+(p[k]||0),0);
  const fol=sum('follows'),unf=sum('unfollows');
  const k={views:monthly?.views??(has('views')?sum('views'):pSum('views')),reach:monthly?.reach??null,
    interactions:monthly?.total_interactions??(has('total_interactions')?sum('total_interactions'):pSum('total_interactions')),
    net:has('follows')?fol-unf:null,followers:conn?.followers??null,posts:posts.length,stories:stories.length,
    eng:(()=>{const e=posts.filter(p=>p.eng!=null);return e.length?e.reduce((s,p)=>s+p.eng,0)/e.length:null})(),
    taps:has('profile_links_taps')?sum('profile_links_taps'):null};
  const fmt={};['reels','carrossel','foto'].forEach(t=>{const ps=posts.filter(p=>p.kind===t);if(!ps.length)return;
    const e=ps.filter(p=>p.eng!=null);fmt[t]={q:ps.length,reach:ps.reduce((s,p)=>s+(p.reach||0),0)/ps.length,views:ps.reduce((s,p)=>s+(p.views||0),0),
      reachSum:ps.reduce((s,p)=>s+(p.reach||0),0),eng:e.length?e.reduce((s,p)=>s+p.eng,0)/e.length:null}});
  const wd=Array.from({length:7},()=>[]);posts.forEach(p=>p.reach!=null&&wd[p.dt.getDay()].push(p.reach));
  const per={manha:[],tarde:[],noite:[]};posts.forEach(p=>{if(p.reach==null)return;const h=p.dt.getHours();per[h<12?'manha':h<18?'tarde':'noite'].push(p)});
  const audience={};aud.forEach(r=>audience[r.kind]=r.data);
  const d={a,month,conn,daily,monthly,posts,stories,k,fmt,audience,
    wd:wd.map(v=>v.length?v.reduce((s,x)=>s+x,0)/v.length:null),
    per:Object.fromEntries(Object.entries(per).filter(([,v])=>v.length).map(([kk,v])=>[kk,{q:v.length,reach:v.reduce((s,p)=>s+p.reach,0)/v.length,eng:(e=>e.length?e.reduce((s,p)=>s+p.eng,0)/e.length:null)(v.filter(p=>p.eng!=null))}])),
    top:[...posts].filter(p=>p.reach!=null).sort((x,z)=>z.reach-x.reach).slice(0,3)};
  d.best=[['Mais salvo','saved','salvamentos'],['Mais compartilhado','shares','compartilhamentos'],['Mais comentado','comments','comentários'],['Mais seguidores','follows','novos seguidores']]
    .map(([t,c,u])=>{const p=[...posts].filter(x=>x[c]>0).sort((x,z)=>z[c]-x[c])[0];return p&&{t,u,p,v:p[c]}}).filter(Boolean);

}
function igLeituras(d){
  const L=[],f=d.fmt,dd=x=>x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const ts=Object.entries(f).filter(([,v])=>v.q>=2);
  if(ts.length>=2){const [b,bv]=[...ts].sort((x,z)=>z[1].reach-x[1].reach)[0];const [w,wv]=[...ts].sort((x,z)=>x[1].reach-z[1].reach)[0];
    if(bv.reach>wv.reach*1.1)L.push(`<b>${KIND_N[b]} alcançaram ${Math.round((bv.reach/wv.reach-1)*100)}% mais</b> pessoas que ${KIND_N[w].toLowerCase()}${w==='foto'?'s':''}, em média (${nBR(bv.reach)} contra ${nBR(wv.reach)}).`);
    const eg=ts.filter(([,v])=>v.eng!=null).sort((x,z)=>z[1].eng-x[1].eng);
    if(eg.length>=2)L.push(`<b>Melhor engajamento: ${KIND_N[eg[0][0]]}</b> (${pcBR(eg[0][1].eng)}). O mais baixo foi ${KIND_N[eg.at(-1)[0]]} (${pcBR(eg.at(-1)[1].eng)}).`)}
  if(d.top[0])L.push(`<b>Maior alcance do mês:</b> “${esc((d.top[0].caption||'Sem legenda').split('\n')[0].slice(0,60))}” (${dd(d.top[0].dt)}), com ${nBR(d.top[0].reach)} contas alcançadas.`);
  const wd=d.wd.map((v,i)=>[v,i]).filter(x=>x[0]!=null);
  if(wd.length>=3){const b=[...wd].sort((x,z)=>z[0]-x[0])[0];L.push(`<b>${DSEM[b[1]]} foi o melhor dia</b> para publicar: alcance médio de ${nBR(b[0])}.`)}
  const pr=Object.entries(d.per);if(pr.length>=2){const NM={manha:'manhã',tarde:'tarde',noite:'noite'};const b=[...pr].sort((x,z)=>z[1].reach-x[1].reach)[0];
    const most=[...pr].sort((x,z)=>z[1].q-x[1].q)[0];L.push(`<b>Posts da ${NM[b[0]]} alcançaram mais</b> (${nBR(b[1].reach)} em média)${most[0]!==b[0]?`, mas a maioria saiu de ${NM[most[0]]}. Vale testar mais horários da ${NM[b[0]]}`:''}.`)}
  const fb=d.best.find(x=>x.t==='Mais seguidores');if(d.k.net!=null)L.push(`<b>${d.k.net>=0?'+':''}${nBR(d.k.net)} seguidores</b> no mês${fb?`. O post que mais trouxe seguidores saiu em ${dd(fb.p.dt)}`:''}.`);
  return L.slice(0,6);
}

function igLine(ser,month,W=640,H=190){
  const vals=ser.filter(v=>v!=null);if(!vals.length)return '<div class="ig-empty">Sem números por dia ainda.</div>';
  const mx=Math.max(1,...vals),mn=Math.min(0,...vals);const top=mx<=10?10:Math.ceil(mx/(10**Math.floor(Math.log10(mx))/2))*(10**Math.floor(Math.log10(mx))/2);
  const X=i=>44+i/(ser.length-1)*(W-80),Y=v=>10+(1-(v-mn)/(top-mn))*(H-36);
  let path='',pen=false;ser.forEach((v,i)=>{if(v==null){pen=false;return}path+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);pen=true});
  const mes=MESES_RP[+month.slice(5)-1].slice(0,3).toLowerCase()+'.';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico por dia">${[top,(top+mn)/2,mn].map(v=>`<line x1="40" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e7e7e7"/><text x="0" y="${Y(v)+4}" font-size="11" fill="#7a7a7a">${milBR(v)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="#0a0a0a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${[1,Math.ceil(ser.length/2),ser.length].map(dd=>`<text x="${X(dd-1)}" y="${H-4}" font-size="11" fill="#7a7a7a" text-anchor="middle">${mes} ${dd}</text>`).join('')}</svg>`;
}
const igBar=(l,sub,parts,max,val)=>`<div class="hb"><div class="hl">${l}${sub?`<small>${sub}</small>`:''}</div><div class="hr"><span class="ibar">${parts.map(([v,c])=>`<i style="width:${max?Math.max(0,v)/max*100:0}%;background:${c}"></i>`).join('')}</span><b>${val}</b></div></div>`;
function igFmtBox(d){const f=Object.entries(d.fmt);if(!f.length)return '';const vmx=Math.max(...f.map(([,v])=>v.views)),emx=Math.max(...f.map(([,v])=>v.eng||0));
  return `<section class="ig-box"><div class="ig-h">Visualizações por formato</div>
    <div class="lg2"><span><i style="background:#0a0a0a"></i>Contas alcançadas</span><span><i style="background:#bdbdbd"></i>Visualizações repetidas</span></div>
    ${f.map(([t,v])=>igBar(KIND_N[t],`${v.q} posts`,[[v.reachSum,'#0a0a0a'],[v.views-v.reachSum,'#bdbdbd']],vmx,milBR(v.views))).join('')}
    <div class="ig-h" style="margin-top:18px">Engajamento por formato</div>${f.map(([t,v])=>igBar(KIND_N[t],'',[[v.eng||0,'#0a0a0a']],emx,pcBR(v.eng))).join('')}</section>`}
function igBestBox(d){const w=d.wd.map((v,i)=>[v,i]);const order=[1,2,3,4,5,6,0];const mx=Math.max(0,...d.wd.filter(v=>v!=null));

async function printDoc(title,body){
  const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"><style>${PLAN_CSS}\n${IG_PDF_CSS}</style></head><body>${body}</body></html>`;
  document.getElementById('plan-print')?.remove();
  const f=document.createElement('iframe');f.id='plan-print';f.title='Documento para imprimir';
  Object.assign(f.style,{position:'fixed',right:'0',bottom:'0',width:'0',height:'0',border:'0'});document.body.appendChild(f);
  const d=f.contentDocument;d.open();d.write(html);d.close();
  await Promise.race([Promise.all([...d.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))),new Promise(r=>setTimeout(r,8000))]);
  if(d.fonts?.ready)await Promise.race([d.fonts.ready,new Promise(r=>setTimeout(r,2000))]);
  toast('Na janela que abrir, escolha "Salvar como PDF"',3500);
  setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print()},300);
}

function popClear(){clearTimeout(POP.timer);POP.cleanup&&POP.cleanup();POP.cleanup=null}
function popAudOk(p){const a=p.publico||[];if(!a.length||a.includes('todos'))return true;if(!USER)return a.includes('sem_conta');if(a.includes('logados'))return true;return a.includes(planoEf(S.profile))}

function popFreqOk(p){if(p.frequencia==='sempre')return true;let t=0;try{t=+localStorage.getItem(popKey(p))||0}catch(e){}if(!t)return true;
  const d=Date.now()-t;return p.frequencia==='dia'?d>864e5:p.frequencia==='30dias'?d>30*864e5:false}
function popLive(p){const n=new Date();return p.ativo&&(!p.inicio||new Date(p.inicio)<=n)&&(!p.fim||new Date(p.fim)>n)}
function popupCheck(key){
  popClear();if(POP_SKIP.includes(route[0])||document.getElementById('ff-pop'))return;
  const p=SITE.popups.find(p=>popLive(p)&&(!(p.paginas||[]).length||p.paginas.includes(key))&&popAudOk(p)&&popFreqOk(p));if(!p)return;
  const show=()=>{popClear();showPopup(p)};
  if(p.momento==='segundos')POP.timer=setTimeout(show,(p.segundos||5)*1000);

    addEventListener('scroll',f,{passive:true});POP.cleanup=()=>removeEventListener('scroll',f)}
  else if(p.momento==='sair'){const f=e=>{if(!e.relatedTarget&&e.clientY<=0)show()};document.addEventListener('mouseout',f);POP.cleanup=()=>document.removeEventListener('mouseout',f)}
  else POP.timer=setTimeout(show,700);
}

function showPopup(p){

function cleanBanners(B){const o={};const P=B.principal||{};if(P.desk?.p||P.mob?.p)o.principal={desk:P.desk||null,mob:P.mob||null,link:(P.link||'').trim(),alt:(P.alt||'').trim()};
  const F=B.faixa||{};if(F.img?.p)o.faixa={img:F.img,link:(F.link||'').trim(),alt:(F.alt||'').trim()};
  const C=(B.carrossel||[]).filter(x=>x.img?.p).slice(0,5).map(x=>({img:x.img,link:(x.link||'').trim()}));if(C.length)o.carrossel=C;return o}
// Banner vai no tamanho original (sem reduzir), até 5 MB
async function uploadBanner(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw new Error('Envie JPG, PNG ou WebP.');
  if(file.size>5*1048576)throw new Error('A imagem passa de 5 MB.');
  const dim=await new Promise(r=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{r({w:i.naturalWidth,h:i.naturalHeight});URL.revokeObjectURL(u)};i.onerror=()=>r({w:0,h:0});i.src=u});
  const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];
  const p=`banners/${crypto.randomUUID()}.${ext}`;
  const {error}=await sb.storage.from('blog').upload(p,file,{contentType:file.type});if(error)throw error;
  return {p,w:dim.w,h:dim.h};
}

function drawPopups(){
  const L=PPA.list;const f=PPA.filter;const st=p=>popSt(p)[0];
  const xs=L.filter(p=>f==='todos'||(f==='on'?st(p)==='on':f==='ag'?st(p)==='ag':st(p)==='off'||st(p)==='fim'));
  const th=p=>`<span class="pp-th ${p.formato}" aria-hidden="true">${p.formato==='barra'?'<i></i>':p.image_path?`<i style="background-image:url('${anyImg(p.image_path)}')"></i>`:'<i></i>'}</span>`;
  admShell('popups',`<div class="adm-head"><div><h1>Pop-ups</h1><p class="sub">Avisos que aparecem por cima das páginas. Escolha onde, quando e para quem cada um aparece.</p></div>
    <button class="pill dark" data-go="admin/popup/novo">+ Novo pop-up</button></div>
    ${chipsHTML([['todos',`Todos · ${L.length}`],['on',`Ativados · ${L.filter(p=>st(p)==='on').length}`],['ag',`Agendados · ${L.filter(p=>st(p)==='ag').length}`],['off',`Desativados · ${L.filter(p=>['off','fim'].includes(st(p))).length}`]],f,'data-f')}
    <div class="pg-list"><div class="pp-row pg-hd"><span>Ordem</span><span>Pop-up</span><span class="hide-sm">Onde aparece</span><span class="hide-sm">Quando</span><span class="hide-sm">Para quem</span><span>Situação</span><span></span></div>
      ${xs.map(p=>{const s=popSt(p);const i=L.indexOf(p);return `<div class="pp-row ${s[0]==='off'?'is-dim':''}">
        <span class="pp-ord"><button data-mv="${i}:-1" aria-label="Subir ${esc(p.nome)}" ${i?'':'disabled'}>↑</button><b>${i+1}</b><button data-mv="${i}:1" aria-label="Descer ${esc(p.nome)}" ${i<L.length-1?'':'disabled'}>↓</button></span>
        <span class="pp-nm">${th(p)}<span><b>${esc(p.nome||p.titulo||'Sem nome')}</b><small class="mut">${POP_FMT[p.formato]}${p.image_path?' · com imagem':''}${p.botao_texto?' · com botão':''}</small></span></span>
        <span class="hide-sm">${esc(popOnde(p))}</span><span class="hide-sm">${popQuando(p)}</span><span class="hide-sm">${esc(popPara(p))}</span>
        <span class="pg-st">${SWITCH(p.ativo,`${p.nome}: ${p.ativo?'ativado':'desativado'}`,`data-sw="${p.id}"`)}<span style="color:${s[0]==='ag'?s[2]:''}">${s[1]}</span></span>
        <button class="ed" data-ed="${p.id}">Editar</button></div>`}).join('')||'<p class="sub" style="margin:18px 0">Nenhum pop-up aqui.</p>'}</div>
    <div class="pp-info">${INFO_IC}<span><b>A ordem decide quem aparece primeiro.</b> Se dois pop-ups puderem aparecer na mesma página, só o de cima aparece; o outro espera a próxima visita. Use ↑ e ↓ para mudar a ordem.</span></div>`,1180);
  bindGo();
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{PPA.filter=b.dataset.f;drawPopups()});
  app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>go('admin/popup/'+b.dataset.ed));
  app.querySelectorAll('[data-sw]').forEach(b=>b.onclick=async()=>{const p=L.find(x=>x.id===b.dataset.sw);b.disabled=true;
    try{await db(sb.from('popups').update({ativo:!p.ativo,updated_at:new Date().toISOString()}).eq('id',p.id));p.ativo=!p.ativo;admLog('conteudo',p.ativo?'ativou pop-up':'desativou pop-up',{popup:p.nome});await loadSite();drawPopups()}catch(e){b.disabled=false}});
  app.querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{const [i,d]=b.dataset.mv.split(':').map(Number);[L[i],L[i+d]]=[L[i+d],L[i]];
    const upd=L.map((p,j)=>({p,j})).filter(({p,j})=>p.ordem!==j);upd.forEach(({p,j})=>p.ordem=j);drawPopups();app.querySelector(`[data-mv="${i+d}:${d}"]`)?.focus();
    try{await Promise.all(upd.map(({p,j})=>db(sb.from('popups').update({ordem:j}).eq('id',p.id))));await loadSite()}catch(e){admPopups()}});
}
const INFO_IC='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>';
async function admPopupEditor(){
  const id=route[2]||'novo';const h=location.hash;
  if(!SITE.loaded)await loadSite();
  if(id==='novo'){let n=0;try{const {count}=await sb.from('popups').select('id',{count:'exact',head:true});n=count||0}catch(e){}
    PE={nome:'',ordem:n,ativo:false,formato:'central',image_path:null,titulo:'',texto:'',botao_texto:'',botao_link:'',paginas:[],momento:'abrir',segundos:5,frequencia:'uma',publico:['todos'],inicio:null,fim:null}}
  else{admLoading('popups');try{PE=await db(sb.from('popups').select('*').eq('id',id).maybeSingle())}catch(e){return}if(!stillHere(h))return;if(!PE)return v404()}
  drawPopupEditor();
}
function drawPopupEditor(){
  const p=PE;const sc=window.scrollY;
  const chip=(attr,v,n,on)=>`<button type="button" class="chip ${on?'on':''}" ${attr}="${esc(v)}" aria-pressed="${on}">${n}</button>`;
  const pages=[...PAGES.filter(x=>x[3]).map(x=>[x[0],pgName(x[0])]),...Object.values(SITE.pages).filter(c=>c.custom).map(c=>[c.key,c.nome||c.key])];
  const fmtCard=(v,n,vis)=>`<button type="button" class="fmt-c ${p.formato===v?'on':''}" data-fmt="${v}" aria-pressed="${p.formato===v}"><span class="fmt-v ${v}" aria-hidden="true">${vis}</span>${n}</button>`;
  app.innerHTML=header('admin')+admTabs('popups')+`<div class="pe">
    <main class="pe-main"><div class="crumb2"><a data-go="admin/popups">Pop-ups</a> / ${p.id?esc(p.nome||'Sem nome'):'Novo pop-up'}</div>
      <div class="pe-head"><h1>${p.id?'Editar pop-up':'Novo pop-up'}</h1><span>${p.ativo?'Ativado':'Desativado'}</span>${SWITCH(p.ativo,'Pop-up ativado','id="pe-on"')}</div>
      <div class="pe-two"><label class="lbl-s">Nome (só você vê)<input class="field" data-p="nome" maxlength="80" value="${esc(p.nome)}" placeholder="Ex.: Cupom de boas-vindas"></label>
        <label class="lbl-s">Ordem<input class="field" type="number" min="1" data-p="ordem1" value="${(p.ordem||0)+1}"></label></div>
      <h2 class="pe-h2">Conteúdo</h2><span class="lbl-s">Formato</span>
      <div class="fmt-g">${fmtCard('central','Central','<i></i>')}${fmtCard('canto','Canto da tela','<i></i>')}${fmtCard('barra','Barra no topo','<i></i>')}</div>
      ${p.formato==='barra'?'':`<span class="lbl-s">Imagem (opcional) · 1080 × 720 px</span>
        <div class="pe-img">${p.image_path?`<i style="background-image:url('${anyImg(p.image_path)}')"></i>`:'<i class="empty"></i>'}<button type="button" class="pill sm" id="pe-up">${p.image_path&&p.image_path!==RAND_IMG?'Trocar':'Enviar imagem'}</button>${p.image_path===RAND_IMG?'<span class="mut" style="font-size:12px">Aleatório · bolinhas</span>':'<button type="button" class="pill sm" id="pe-rand">Aleatório (bolinhas)</button>'}${p.image_path?'<button type="button" class="danger-link" id="pe-rmimg">Tirar</button>':''}</div>`}
      <label class="lbl-s">Título<input class="field" data-p="titulo" maxlength="100" value="${esc(p.titulo)}" placeholder="Ex.: 1º mês do Pro por nossa conta"></label>
      <label class="lbl-s">Texto<textarea class="field ta" rows="2" data-p="texto" maxlength="300">${esc(p.texto)}</textarea></label>
      <div class="pe-two"><label class="lbl-s">Texto do botão (opcional)<input class="field" data-p="botao_texto" maxlength="40" value="${esc(p.botao_texto)}" placeholder="Ex.: Usar cupom"></label>
        <label class="lbl-s">Link do botão<input class="field" data-p="botao_link" maxlength="300" value="${esc(p.botao_link)}" placeholder="/#planos ou https://…"></label></div>
      <h2 class="pe-h2">Quando aparece</h2><span class="lbl-s">Em quais páginas</span>
      <div class="chips">${chip('data-pg','*','Todas',!p.paginas.length)}${pages.map(([k,n])=>chip('data-pg',k,esc(n),p.paginas.includes(k))).join('')}</div>
      <div class="pe-two"><label class="lbl-s">Momento<select class="field" data-p="momento">${Object.entries(POP_MOM).map(([v,n])=>`<option value="${v}" ${p.momento===v?'selected':''}>${n}</option>`).join('')}</select></label>
        ${p.momento==='segundos'?`<label class="lbl-s">Quantos segundos<input class="field" type="number" min="1" max="120" data-p="segundos" value="${p.segundos}"></label>`
          :`<label class="lbl-s">Quantas vezes<select class="field" data-p="frequencia">${Object.entries(POP_FREQ).map(([v,n])=>`<option value="${v}" ${p.frequencia===v?'selected':''}>${n}</option>`).join('')}</select></label>`}</div>
      ${p.momento==='segundos'?`<label class="lbl-s">Quantas vezes<select class="field" data-p="frequencia">${Object.entries(POP_FREQ).map(([v,n])=>`<option value="${v}" ${p.frequencia===v?'selected':''}>${n}</option>`).join('')}</select></label>`:''}
      ${p.momento==='sair'?'<p class="role-help">No celular não existe "sair da página": lá este pop-up não aparece.</p>':''}
      <p class="role-help">"Uma vez por pessoa" vale por aparelho: se a pessoa usar outro celular ou computador, pode ver de novo.</p>
      <span class="lbl-s">Para quem</span><div class="chips">${POP_PUB.map(([v,n])=>chip('data-pub',v,n,(p.publico||[]).includes(v))).join('')}</div>
      <div class="pe-two"><label class="lbl-s">Começa em (opcional)<input class="field" type="datetime-local" data-p="inicio" value="${toLocalInput(p.inicio)}"></label>
        <label class="lbl-s">Termina em (opcional)<input class="field" type="datetime-local" data-p="fim" value="${toLocalInput(p.fim)}"></label></div>
      <div class="acts-row" style="margin-top:26px"><button class="pill dark" id="pe-save">Salvar pop-up</button><button class="pill" data-go="admin/popups">Cancelar</button>${p.id?'<button class="danger-link" id="pe-del" style="margin-left:auto">Apagar pop-up</button>':''}</div>
    </main>
    <aside class="pe-side" aria-label="Prévia do pop-up"><span class="lbl-s" style="margin-top:0">Prévia</span>
      <div class="pe-frame" id="pe-prev" aria-hidden="true"></div>
      <p class="role-help" id="pe-resumo"></p>
      ${p.id?`<div class="adm-stats sm"><div><b>${p.vistos||0}</b><span>vezes que apareceu</span></div><div><b>${p.cliques||0}</b><span>cliques no botão</span></div><div><b>${p.fechados||0}</b><span>fecharam</span></div></div>`:''}
    </aside></div>`;
  bindHeader();window.scrollTo(0,sc);
  const prev=()=>{document.getElementById('pe-prev').innerHTML=popPreviewHTML(p);
    document.getElementById('pe-resumo').innerHTML=`Aparece em <b>${esc(popOnde(p))}</b>, ${popQuando(p).replace(' · ',', ')}, para <b>${esc(popPara(p))}</b>. É o ${(p.ordem||0)+1}º da fila.`};
  prev();
  const root=app.querySelector('.pe');
  const onField=e=>{const el=e.target;const f=el.dataset.p;if(!f)return;
    if(f==='ordem1')p.ordem=Math.max(0,(parseInt(el.value,10)||1)-1);
    else if(f==='segundos')p.segundos=Math.min(120,Math.max(1,parseInt(el.value,10)||5));
    else if(f==='inicio'||f==='fim')p[f]=el.value?new Date(el.value).toISOString():null;
    else p[f]=el.value;
    if(f==='momento'&&e.type==='change'){drawPopupEditor();return}prev()};
  root.addEventListener('input',onField);root.addEventListener('change',onField);
  root.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{p.formato=b.dataset.fmt;drawPopupEditor()});
  root.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{const v=b.dataset.pg;if(v==='*')p.paginas=[];else p.paginas=p.paginas.includes(v)?p.paginas.filter(x=>x!==v):[...p.paginas,v];drawPopupEditor()});
  root.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>{const v=b.dataset.pub;let a=(p.publico||[]).filter(x=>x!=='todos');
    if(v==='todos')a=['todos'];else{a=a.includes(v)?a.filter(x=>x!==v):[...a,v];if(!a.length)a=['todos']}p.publico=a;drawPopupEditor()});
  document.getElementById('pe-on').onclick=()=>{p.ativo=!p.ativo;drawPopupEditor();document.getElementById('pe-on')?.focus()};
  const up=document.getElementById('pe-up');
  if(up)up.onclick=async()=>{const files=await pickBlogFiles('image/jpeg,image/png,image/webp');if(!files.length)return;toast('Enviando…',20000);
    try{p.image_path=await uploadBlog(files[0]);toast('Imagem enviada');drawPopupEditor()}catch(err){toast(traduz(err.message))}};
  const rnb=document.getElementById('pe-rand');if(rnb)rnb.onclick=()=>{p.image_path=RAND_IMG;drawPopupEditor()};
  const rmi=document.getElementById('pe-rmimg');if(rmi)rmi.onclick=()=>{p.image_path=null;drawPopupEditor()};
  bindGo();
  const del=document.getElementById('pe-del');
  if(del)del.onclick=async()=>{if(!confirm(`Apagar o pop-up "${p.nome||p.titulo}"?`))return;
    try{await db(sb.from('popups').delete().eq('id',p.id));admLog('conteudo','apagou pop-up',{popup:p.nome});await loadSite();toast('Pop-up apagado');go('admin/popups')}catch(e){}};
  document.getElementById('pe-save').onclick=async()=>{
    if(!p.titulo.trim()&&!p.image_path)return toast('Escreva um título ou envie uma imagem.');
    if(p.botao_texto.trim()&&!bnLink(p.botao_link))return toast('Coloque um link válido no botão (ex.: /#planos ou https://…).',3800);
    if(p.inicio&&p.fim&&p.fim<=p.inicio)return toast('O fim precisa ser depois do começo.');
    const row={nome:(p.nome||p.titulo).trim().slice(0,80),ordem:p.ordem||0,ativo:!!p.ativo,formato:p.formato,image_path:p.formato==='barra'?null:p.image_path,titulo:p.titulo.trim(),texto:p.texto.trim(),
      botao_texto:p.botao_texto.trim(),botao_link:p.botao_link.trim(),paginas:p.paginas,momento:p.momento,segundos:p.segundos||5,frequencia:p.frequencia,publico:p.publico,inicio:p.inicio,fim:p.fim,updated_at:new Date().toISOString()};
    const s=document.getElementById('pe-save');s.disabled=true;
    try{const r=await db(p.id?sb.from('popups').update(row).eq('id',p.id).select('*').single():sb.from('popups').insert(row).select('*').single());
      admLog('conteudo','salvou pop-up',{popup:row.nome,ativo:row.ativo});await loadSite();toast(p.id?'Pop-up salvo':'Pop-up criado');PE=r;history.replaceState(null,'','#admin/popup/'+r.id);route=['admin','popup',r.id];drawPopupEditor()}
    catch(e){s.disabled=false}};
}

/* ======================= Aviso de sem internet ======================= */
function netState(){let n=document.getElementById('net');
  if(navigator.onLine){if(n){n.remove();toast('Conexão de volta')}return}
  if(!n){n=document.createElement('div');n.id='net';n.className='net';n.setAttribute('role','status');
    n.textContent='Sem internet. O que você mudar agora pode não ser salvo.';document.body.appendChild(n)}}
window.addEventListener('online',netState);window.addEventListener('offline',netState);

(async function boot(){
  try{const r=await fetch(`https://picsum.photos/v2/list?page=${1+rnd(8)}&limit=80`);const j=await r.json();if(j.length>20)POOL=j.map(x=>[x.id,x.author])}catch(e){}
  const {data:{session}}=await sb.auth.getSession();USER=session?.user||null;
  let bootErr=null;
  await Promise.all([loadManut(),loadSite()]);
  if(USER){try{await loadAll()}catch(e){bootErr=e}}
  if(bootErr){booted=true;(!navigator.onLine||/fetch|network/i.test(bootErr.message||''))?vOffline():vErro();return}
  // Chegou pelo link do e-mail?
  const to=h=>history.replaceState(null,'',location.pathname+'#'+h);
  if(LINK.err){authNote='Esse link expirou ou já foi usado. Entre com seu e-mail e senha. Se a conta ainda não foi confirmada, você pode pedir um novo link.';to(USER?'home':'entrar')}
  else if(LINK.type==='signup')to('confirmado');
  else if(LINK.type==='email_change'){to('config');setTimeout(()=>toast('E-mail atualizado'),400)}
  else if(LINK.type!=='recovery'&&USER&&['','#home'].includes(location.hash)&&needsTutorial())to('boas-vindas');
  if(location.search)history.replaceState(null,'',location.pathname+location.hash);
  booted=true;render();netState();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
