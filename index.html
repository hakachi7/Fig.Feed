<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fig.Feed</title>
<meta name="description" content="Monte e organize feeds, carrosséis e cronogramas de forma visual.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fig.Feed">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#ffffff; --fg:#0a0a0a; --muted:#7a7a7a; --line:#e7e7e7; --tile:#d9d9d9; --soft:#f4f4f4; --panel:#f1f0ee;
  --accent:#ff1f1f; --drop:#14d36a; --badge:#2f45ff; --err:#c4281c;
  --f:"Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
img{display:block;max-width:100%}
.view{min-height:100%}
/* ---------- Carregando: "Montando seu feed…" (V4) ---------- */
.loading{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:var(--muted);font-size:13px}
.ld-grid{display:grid;grid-template-columns:repeat(3,36px);gap:6px}
.ld-grid i{height:46px;background:linear-gradient(90deg,#efefef 0%,#fbfbfb 50%,#efefef 100%);background-size:200% 100%;animation:shim 1.4s ease-in-out infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.ld-grid i{animation:none}}

/* ---------- E-mail confirmado (V4) ---------- */
.auth-ok{width:52px;height:52px;border-radius:50%;background:#eaf6ee;color:#1e6b3a;display:grid;place-items:center;margin:0 auto 10px}

/* ---------- Tutorial de primeiro acesso (V4) ---------- */
.tut{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;text-align:center}
.tut .top{height:40px}
.tut .body{margin:auto 0;display:flex;flex-direction:column;align-items:center;width:min(440px,100%)}
.tut .vis{min-height:372px;display:grid;place-items:center;margin-bottom:30px}
.tut h1{font-size:clamp(26px,3vw,32px);font-weight:400;letter-spacing:-.02em;margin:0 0 12px}
.tut h1:focus{outline:none}
.tut p{color:var(--muted);margin:0;line-height:1.5;max-width:340px}
.tut .dots{display:flex;gap:6px;margin:24px 0 22px}
.tut .dots i{width:22px;height:3px;border-radius:2px;background:#e5e5e5;transition:background .2s}
.tut .dots i.on{background:var(--fg)}
.tut .acts{display:flex;gap:10px}
.tut-grid{display:grid;grid-template-columns:repeat(3,min(96px,26vw));gap:6px}
.tut-grid div{aspect-ratio:4/5;background:var(--tile) center/cover}
.tut-grid div.lift{outline:2px solid var(--accent);outline-offset:2px;transform:translateY(-6px) rotate(-2deg);box-shadow:0 12px 24px rgba(0,0,0,.18)}
.tut-week{display:grid;grid-template-columns:repeat(5,min(64px,16vw));gap:6px;text-align:left}
.tut-week .c{background:var(--soft);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:250px}
.tut-week .d{font-size:11px;color:var(--muted)}
.tut-week .k{background:#fff;border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:4px}
.tut-week .k i{display:block;aspect-ratio:4/5;background:var(--tile) center/cover;border-radius:3px}
.tut-week .k b{width:7px;height:7px;border-radius:50%;display:block}
.tut-prof{display:flex;flex-direction:column;align-items:center;gap:12px}
.tut-prof .avatar{width:64px;height:64px}
.tut-prof .tut-grid{grid-template-columns:repeat(3,min(72px,22vw))}

/* ---------- Entrar / criar conta (estilo Cosmos) ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-l{display:flex;flex-direction:column;align-items:center;padding:36px 24px 40px}
.auth-l .top{height:40px}
.auth-f{margin:auto 0;width:min(326px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.auth-f h1{font-size:18px;font-weight:500;margin:0;letter-spacing:-.01em}
.auth-f .sub{margin:2px 0 14px;color:var(--muted);font-size:13px}
.auth-f .sub a,.auth-f .link{color:var(--fg);cursor:pointer;text-decoration:none}
.auth-f input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 16px;font-size:14px;outline:none;background:#fff}
.auth-f input:focus{border-color:#bdbdbd}
.pw{position:relative}
.pw input{padding-right:48px}
.pw button{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:grid;place-items:center;color:#444}
.auth-btn{height:52px;border-radius:99px;background:var(--fg);color:#fff;font-weight:600;font-size:14px;margin-top:2px}
.auth-btn[disabled]{opacity:.55;cursor:default}
.auth-f .forgot{color:var(--muted);font-size:13px;margin-top:6px;cursor:pointer}
.auth-f .msg{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;text-align:left}
.auth-f .msg.err{background:#fdecea;color:var(--err)}
.auth-f .msg.ok{background:#eaf6ee;color:#1e6b3a}
.auth-word{font-weight:600;font-size:19px;letter-spacing:-.01em;text-transform:uppercase}
.auth-r{background:var(--panel);position:relative;overflow:hidden;height:100vh;position:sticky;top:0}
.auth-r .col{display:flex;flex-direction:column;align-items:center;gap:32px;animation:rise 70s linear infinite}
.auth-r .col img{object-fit:cover}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.auth-r .cap{position:absolute;left:20px;bottom:14px;font-size:10px;font-weight:600;line-height:1.25}
@media (max-width:820px){.auth{grid-template-columns:1fr}.auth-r{display:none}}
@media (prefers-reduced-motion:reduce){.auth-r .col{animation:none}}

/* ---------- 1. Home ---------- */
.home{height:100vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.home .word{font-size:clamp(44px,6.7vw,128px);font-weight:400;letter-spacing:-.025em;text-align:center;line-height:1}
.home .photo{width:clamp(130px,19vw,364px);aspect-ratio:364/478;position:relative;overflow:hidden;background:var(--tile)}
.home .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease}
.home .photo img.on{opacity:1}
.home .photo button{position:absolute;inset:0;z-index:2}

/* ---------- 2. Menu ---------- */
.menu{position:fixed;inset:0;overflow:hidden;color:#fff;background:#222}
.menu .blur{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.05);transform:scale(1.08)}
.menu .shade{position:absolute;inset:0;background:rgba(0,0,0,.12)}
.menu nav{position:absolute;left:60%;top:4%;display:flex;flex-direction:column;gap:clamp(18px,2.2vw,34px);font-size:clamp(15px,1.15vw,22px);line-height:1.12}
.menu ol{list-style:none;margin:0;padding:0}
.menu li button{color:#fff;text-align:left;padding:0;transition:opacity .2s}
.menu li button:hover{opacity:.6}
.menu .credit{position:absolute;left:clamp(16px,4.7vw,90px);bottom:clamp(20px,5vw,60px);font-size:clamp(11px,.85vw,15px)}
@media (max-width:640px){.menu nav{left:auto;right:20px;top:24px}}

/* ---------- Cabeçalho (estilo Cosmos) ---------- */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px max(16px,2.2vw)}
.hdr .l{display:flex;align-items:center;gap:22px;min-width:0}
.hdr .r{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.logo{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.logo i{width:6px;height:7.5px;background:var(--fg);display:block}
.logo.big{grid-template-columns:repeat(3,8px)}.logo.big i{width:8px;height:10px}
.nav a{font-size:15px;color:var(--muted);text-decoration:none;font-weight:500;position:relative;white-space:nowrap;cursor:pointer}
.nav a.cur{color:var(--fg)}
.nav .badge{position:absolute;top:-10px;right:-15px;background:var(--badge);color:#fff;font-size:10px;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.crumb{color:var(--fg);font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{color:var(--muted);font-weight:400}
.search{display:flex;align-items:center;gap:10px;width:min(430px,34vw);border:1px solid var(--line);background:#fafafa;border-radius:99px;padding:10px 16px}
.search svg{flex:none}
.search input{border:0;background:none;outline:none;width:100%;font-size:14px}
.pill{border:1px solid var(--line);border-radius:99px;padding:9px 16px;display:inline-flex;align-items:center;gap:7px;font-weight:500;background:#fff}
.pill:hover{background:var(--soft)}
.pill.dark{background:var(--fg);color:#fff;border-color:var(--fg)}
.avatar{width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center;background-color:var(--tile)}
.who{display:flex;align-items:center;gap:6px}
.drop{position:absolute;right:max(16px,2.2vw);top:62px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.08);padding:6px;min-width:230px;display:flex;flex-direction:column;z-index:30}
.drop button,.drop .lbl{padding:9px 12px;border-radius:8px;text-align:left}
.drop button:hover{background:var(--soft)}
.drop .lbl{color:var(--muted);font-size:12px}
.drop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.drop form{display:flex;gap:6px;padding:4px 6px}
.drop input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
/* ---------- Menu do ícone (V3) ---------- */
.logo-btn{width:36px;height:36px;margin:-7px -4px -7px -8px;border-radius:9px;display:grid;place-items:center;flex:none;transition:background .15s}
.logo-btn:hover,.logo-btn[aria-expanded="true"]{background:var(--soft)}
.drop.left{left:max(16px,2.2vw);right:auto;min-width:250px;max-height:calc(100vh - 80px);overflow-y:auto}
.drop .it{display:flex;align-items:center;gap:11px;min-height:40px}
.drop .it svg{flex:none;color:#555}
.drop .it.cur{background:var(--soft);font-weight:600}
.drop .it .avatar{width:20px;height:20px;flex:none}
.drop .it .n{margin-left:auto;background:var(--badge);color:#fff;font-size:10px;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:500}
.drop .it .h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop .danger,.drop .danger svg{color:var(--err)}
.drop .ver{color:#aaa;font-size:11px;padding:6px 12px 4px}


/* ---------- V6: telas de aviso ---------- */
.st{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 16px 90px;text-align:center;position:relative}
.st .big{font-size:clamp(64px,8vw,104px);font-weight:400;letter-spacing:-.03em;line-height:1;color:var(--muted)}
.st h1{font-size:clamp(26px,3vw,34px);font-weight:400;letter-spacing:-.02em;margin:0}
.st p{color:var(--muted);max-width:380px;margin:0;line-height:1.5}
.st .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.st .small{font-size:12px;max-width:310px}.st .small a{color:var(--fg)}
.st .tks{position:absolute;left:clamp(16px,4.7vw,68px);bottom:28px;font-size:11px;text-align:left;line-height:1.35}
.nf-grid{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.nf-grid div{height:70px;background:var(--tile) center/cover}
.nf-grid .hole{background:none;border:1px dashed #bdbdbd}
.st .one{width:160px;aspect-ratio:4/5;background:var(--tile) center/cover;filter:grayscale(1)}
.mnt{position:relative}
.mnt .msg{position:absolute;left:16px;right:16px;bottom:clamp(24px,5vh,48px);text-align:center;font-size:13px}
.mnt .msg span{display:block;color:var(--muted);margin-top:6px}

/* ---------- V6: páginas da conta e públicas ---------- */
.pub-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,2.2vw)}
.pub-hdr .brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px}
.pub-hdr .r{display:flex;gap:8px}
.doc{max-width:820px}
.doc .warn{background:#fff7dc;border:1px solid #f1d98a;border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.5;margin:0 0 36px}
.doc h2{font-size:18px;font-weight:500;margin:34px 0 12px;letter-spacing:-.01em}
.doc p,.doc li{line-height:1.6;max-width:600px}
.doc ul{padding-left:20px;margin:0}
.help-q{width:100%;margin-bottom:24px}
.faq details{border-top:1px solid var(--line)}.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{padding:16px 0;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-weight:500;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';color:var(--muted);font-weight:400}.faq details[open] summary::after{content:'–'}
.faq details p{margin:0 0 16px;color:#444}
.kbd-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;border:1px solid #d6d6d6;border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:#fafafa}
.contact{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:44px}
.contact small{color:var(--muted)}.contact a.pill{text-decoration:none;color:var(--fg)}
.rel{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:22px 0;border-top:1px solid var(--line)}
.rel small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.rel ul{line-height:1.75}
@media (max-width:600px){.rel{grid-template-columns:1fr;gap:6px}}
.field{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;background:#fff;outline:none}
.field:focus{border-color:#bdbdbd}
.sec-block{padding:24px 0;border-bottom:1px solid var(--line)}
.sec-block h2{font-size:16px;font-weight:500;margin:0}
.sec-block label,.lbl-s{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
.sec-block .pill{margin-top:14px}
.msg-inline{font-size:13px;margin-top:10px;line-height:1.45}.msg-inline.ok{color:#1e6b3a}.msg-inline.err{color:var(--err)}
.dev{display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line);margin-top:0}
.sec-block .dev:first-child{margin-top:14px}
.dev .tag{font-size:11px;background:var(--soft);border-radius:6px;padding:2px 7px}
.dev time{margin-left:auto;color:var(--muted);font-size:12px}
.danger-link{color:var(--err);cursor:pointer;font-size:13px}
.del-box{border:1px solid var(--line);border-radius:14px;padding:18px 18px 4px}
.del-box>b{display:block;margin-bottom:14px;font-weight:500}
.dr{display:grid;grid-template-columns:54px 1fr;padding:13px 0;border-top:1px solid var(--line)}
.muted{color:var(--muted)}.ul{color:inherit;text-decoration:underline;cursor:pointer}
.acts-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.pill.danger{color:var(--err);border-color:#f0b9b3}.pill.danger[disabled]{opacity:.5;cursor:default}
.drop .ver{display:block;width:100%;text-align:left;color:#9a9a9a}.drop button.ver:hover{color:var(--fg)}


/* ---------- V7: página pública, Planos, Lixeira e Biblioteca ---------- */
.land-hero{height:calc(100vh - 140px);min-height:420px}
.land-cta{text-align:center;padding:20px 16px 80px}
.land-cta p{font-size:clamp(17px,1.6vw,21px);max-width:340px;margin:0 auto 22px;line-height:1.4}
.land-cta .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.land-feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;max-width:1080px;margin:0 auto;padding:20px max(16px,2.2vw) 90px}
.land-feat h2{font-size:16px;font-weight:500;margin:16px 0 6px}.land-feat p{color:var(--muted);margin:0;line-height:1.5}
.g6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.g6 div{aspect-ratio:4/5;background:var(--tile) center/cover}
@media (max-width:760px){.land-feat{grid-template-columns:1fr;gap:44px}.land-hero{height:62vh}}
.pub-foot{border-top:1px solid var(--line);padding:22px max(16px,4vw);display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pub-foot a{color:var(--muted);text-decoration:underline;cursor:pointer}
.planos{max-width:1000px;text-align:center}
.pl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;text-align:left}
@media (max-width:820px){.pl-grid{grid-template-columns:1fr;max-width:420px;margin:0 auto}}
.pl{border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column}
.pl.top{border:1.5px solid var(--fg)}
.pl-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.pl-h .tag{font-size:11px;background:var(--soft);border-radius:99px;padding:3px 9px}
.pl-p{margin:18px 0 12px;display:flex;align-items:baseline;gap:6px}.pl-p b{font-size:34px;font-weight:400;letter-spacing:-.02em}.pl-p small{color:var(--muted)}
.pl ul{padding-left:18px;margin:0 0 22px;line-height:1.85;flex:1}
.pl .pill{justify-content:center;width:100%}
.pg-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.tr-list{border-top:1px solid var(--line)}
.tr{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.tr .th{width:44px;height:55px;flex:none;background:var(--tile) center/cover}
.tr .tx{flex:1;min-width:0}.tr .tx b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .tx small,.tr .left{color:var(--muted);font-size:12px}
@media (max-width:560px){.tr .left{display:none}}
.lib{max-width:1100px}
.bar-use{height:4px;background:var(--soft);border-radius:4px;margin:-14px 0 22px;overflow:hidden}.bar-use i{display:block;height:100%;background:var(--fg)}
.lib-chips{margin-bottom:18px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.lib-it{aspect-ratio:4/5;background:var(--tile) center/cover;position:relative;border-radius:2px}
.lib-it .free{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);font-size:10px;border-radius:99px;padding:2px 7px}


/* ---------- V8: Stories, Prévia e Relatório ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.acc-tabs{margin-top:-4px}
.stp{padding:34px max(16px,4vw) 80px}
.st-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.st-top .avatar{width:52px;height:52px}.st-top .muted{font-size:13px}
.st-day{margin-left:auto}.st-day .field{height:38px;width:auto;border-radius:99px;padding:0 12px}
.st-row{display:flex;align-items:center;gap:14px;overflow-x:auto;padding:10px 4px 18px}
.st-it{flex:none;width:118px;aspect-ratio:9/16;border-radius:8px;background:var(--tile) center/cover;position:relative;cursor:grab;transition:width .2s}
.st-it span{position:absolute;left:8px;bottom:8px;color:#fff;font-size:10px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.st-it.sel{width:178px;outline:2px solid var(--accent);outline-offset:3px}
.hint-s{color:var(--muted);font-size:12px;margin:18px 0}
.pv{display:flex;flex-direction:column;align-items:center;padding:30px 16px 80px}
.pv-tog{display:flex;gap:8px;margin-bottom:28px}
.pv-phone{width:min(400px,100%)}
.pv-head{display:flex;align-items:center;gap:22px}
.pv-av{width:86px;height:86px;flex:none}
.pv-nums{display:flex;gap:22px;flex:1;justify-content:center;text-align:center}
.pv-nums b{display:block;font-size:16px}.pv-nums span{font-size:13px}
.pv-bio{margin:16px 0 0;font-size:13px}.pv-bio p{margin:3px 0 0;white-space:pre-line;line-height:1.45}
.pv-edit{width:100%;justify-content:center;margin:14px 0 4px;font-size:13px;padding:7px}
.pv-hl{display:flex;gap:14px;overflow-x:auto;padding:14px 0 6px}
.pv-hl div{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:64px}
.pv-hl span{width:60px;height:60px;border-radius:50%;background:var(--tile) center/cover;box-shadow:0 0 0 2px #fff,0 0 0 3px #dbdbdb}
.pv-hl small{font-size:11px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);margin-top:12px;font-size:12px;color:var(--muted)}
.pv-tabs span{padding:10px 0}.pv-tabs .cur{color:var(--fg);font-weight:600;box-shadow:inset 0 1px 0 var(--fg)}
.pv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.pv-grid a{aspect-ratio:4/5;background:var(--tile) center/cover;cursor:pointer}
.pv-form{background:#fff;margin:auto;width:min(440px,calc(100vw - 32px));border-radius:16px;padding:24px;max-height:calc(100vh - 40px);overflow:auto;align-self:center}
.ov:has(.pv-form){justify-content:center}
.pv-form h2{font-size:18px;font-weight:500;margin:0 0 4px}
.pv-form label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
.pv-form textarea.field{height:auto;padding:10px 12px;resize:vertical;font:inherit}
.pv-form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rp{max-width:900px}
.rp-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.rp-top h1{margin:0}.rp-av{width:52px;height:52px;flex:none}
.rp-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stats.rp-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.stats.rp-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rp-bars{display:flex;align-items:flex-end;gap:12px;height:170px;border-bottom:1px solid var(--line);margin:10px 0 40px;padding-top:20px}
.rp-bars div{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;position:relative}
.rp-bars i{display:block;width:min(70px,60%);background:var(--fg);border-radius:2px 2px 0 0;min-height:2px}
.rp-bars .v{font-size:12px}.rp-bars small{position:absolute;bottom:-24px;font-size:12px;color:var(--muted)}
.rp-feed{display:grid;grid-template-columns:repeat(3,minmax(0,128px));gap:6px}
.rp-feed div{aspect-ratio:4/5;background:var(--tile) center/cover}
@media print{.hdr,.adm-tabs,.no-print,.toast,.net{display:none!important}.page{padding-top:10px}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}


/* ---------- V9: planejamento ---------- */
.sp select,.sp input[type=time],.sp #sp-cta{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;font-size:13px;max-width:100%}
.sp #sp-cta{width:100%}
.plan-box{margin-top:44px;border-top:1px solid var(--line);padding-top:26px;max-width:520px}
.plan-box h2{font-size:18px;font-weight:500;margin:0 0 4px}
.plan-box textarea.field{height:auto;padding:10px 12px;resize:vertical;font:inherit;font-size:14px;line-height:1.45}
.plan-box .lbl-s small{color:var(--muted)}
.pl-row{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;margin-bottom:8px}.pl-row .pill{padding:0;justify-content:center;height:44px}
.st-acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media (max-width:700px){.dl{grid-template-columns:1fr}.dl .mini{display:none}}

/* ---------- Página não encontrada (404, v3) ---------- */
.nf{min-height:calc(100vh - 66px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,4vw,48px);padding:40px 16px 80px;text-align:center}
.nf .num{display:flex;align-items:center;gap:clamp(12px,2.2vw,36px)}
.nf .word{font-size:clamp(64px,10vw,168px);font-weight:400;letter-spacing:-.03em;line-height:1}
.nf .hole{width:clamp(84px,11vw,190px);aspect-ratio:364/478;border:1.5px dashed #bdbdbd;display:grid;place-items:center;color:var(--muted);font-size:clamp(10px,.9vw,13px);padding:8px}
.nf h1{font-size:18px;font-weight:500;margin:0;letter-spacing:-.01em}
.nf p{margin:6px 0 0;color:var(--muted)}
.nf .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- Aviso de sem internet ---------- */
.net{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:95;background:var(--fg);color:#fff;font-size:12px;padding:8px 14px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.15);white-space:nowrap}

@media (max-width:760px){.hdr{grid-template-columns:1fr auto}.hdr .mid{display:none}.nav a{font-size:14px}.hdr .l{gap:14px}}

/* ---------- 3. Contas ---------- */
.contas{min-height:calc(100vh - 66px);display:flex;align-items:center;justify-content:center;padding:40px max(16px,4vw)}
.accs{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(40px,4.9vw,94px)}
.acc{display:flex;flex-direction:column;gap:clamp(16px,1.7vw,32px);width:clamp(220px,19vw,364px)}
.acc .g{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(5px,.42vw,8px);transition:transform .25s}
.acc .g div{aspect-ratio:101/131;background:var(--tile) center/cover}
.acc:hover .g{transform:translateY(-4px)}
.acc .h{font-size:11px;text-align:left}
.empty{color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:360px}
.empty h2{color:var(--fg);font-size:22px;font-weight:400;letter-spacing:-.02em;margin:0}
.empty .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- 4. Feed ---------- */
.feed{display:flex;justify-content:center;padding:50px 16px 80px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,.65vw,10px);width:min(394px,92vw)}
.item{position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.armed{transform:scale(.96);transition:transform .15s}
.avatar{display:block;flex:none}
.tile{aspect-ratio:125/164;background:var(--tile) center/cover;cursor:grab;transition:opacity .2s}
.tile .multi{position:absolute;top:6px;right:6px;width:14px;height:14px}
.tile.dim{opacity:.18}
.tile .dt{position:absolute;left:6px;bottom:5px;font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.grid:hover .tile .dt{opacity:1}
.is-ph{outline:2px dashed var(--drop);outline-offset:-2px}
.is-ph > *{opacity:.15}
.is-ph.tile,.is-ph.slide{background-image:none!important;background-color:var(--soft)}
.ghost{position:fixed;z-index:80;pointer-events:none;outline:2px solid var(--accent);box-shadow:0 18px 40px rgba(0,0,0,.25);transform:scale(1.04)}
.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- 5. Carrossel ---------- */
.car{padding:0 0 60px}
.prog{position:relative;height:1px;background:#8a8a8a;margin:56px 0 0 15.4%}
.prog i{position:absolute;top:-1px;height:3px;background:var(--fg);width:40px;left:0}
.car .meta{margin:72px 0 34px max(16px,8.1%);font-size:11px;display:flex;flex-direction:column;gap:12px;max-width:260px}
.car .meta .t{outline:none}
.car .meta .t:focus{background:var(--soft)}
.track{display:flex;gap:clamp(24px,4.7vw,64px);overflow-x:auto;padding:0 max(16px,8.1%) 24px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:none;width:clamp(170px,18.3vw,250px);aspect-ratio:247/325;background:var(--tile) center/cover;cursor:grab}
.slide .x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);font-size:13px;line-height:22px;text-align:center;opacity:0;transition:opacity .2s}
.slide:hover .x{opacity:1}
.addslide{flex:none;width:clamp(170px,18.3vw,250px);aspect-ratio:247/325;border:1px dashed #bbb;color:var(--muted);display:grid;place-items:center;font-size:12px}
.cap{margin:60px 0 0 max(16px,8.1%);max-width:260px;font-size:11px;line-height:1.45;text-align:left;white-space:pre-wrap}
.cap:hover{background:var(--soft)}
.cap.ph{color:var(--muted)}

/* ---------- 6. Editar texto ---------- */
.edit{min-height:100vh;padding:clamp(20px,2.6vw,40px) clamp(16px,2.6vw,40px)}
.edit .top{display:flex;align-items:center;gap:16px}
.edit .top .avatar{width:38px;height:38px}
.edit .top .h{font-size:11px;flex:1}
.edit .top button{font-size:13px;color:var(--muted)}
.edit .top button.done{color:var(--fg);font-weight:500}
.edit textarea{display:block;width:min(820px,100%);margin:clamp(60px,8vw,100px) 0 0;border:0;outline:none;resize:none;font-size:clamp(22px,2.4vw,30px);line-height:1.22;letter-spacing:-.005em;background:none;overflow:hidden;caret-color:var(--fg)}
.edit .count{font-size:11px;color:var(--muted);margin-top:18px}

/* ---------- 7. Download ---------- */
.dl{min-height:calc(100vh - 66px);display:grid;grid-template-columns:1fr 1fr;align-items:start;padding-top:56px!important;padding-bottom:80px!important;padding:0 max(16px,4.7vw);position:relative}
.dl h1{font-size:clamp(44px,6.7vw,128px);font-weight:400;letter-spacing:-.025em;margin:0;line-height:1}
.dl .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.dl .pick{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px;font-size:12px}
.dl .pick button{color:var(--muted)}
.dl .pick button.cur{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.dl .mini{justify-self:center;position:sticky;top:120px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:clamp(120px,14vw,190px)}
.dl .mini div{aspect-ratio:30/40;background:var(--tile) center/cover}
.dl .tks{position:absolute;left:max(16px,4.7vw);bottom:30px;font-size:11px;line-height:1.3}
@media (max-width:700px){.dl{grid-template-columns:1fr;gap:40px;padding-block:60px 100px}}

/* ---------- Cronograma / Perfil / Configuração ---------- */
.page{max-width:820px;margin:0 auto;padding:56px 16px 80px}
.page h1{font-size:clamp(34px,4vw,56px);font-weight:400;letter-spacing:-.025em;margin:0 0 6px}
.page .sub{color:var(--muted);margin:0 0 40px}
.day{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:18px 0;border-top:1px solid var(--line)}
.day .d{font-size:12px;font-variant-numeric:tabular-nums}
.day .d b{display:block;font-size:22px;font-weight:400;letter-spacing:-.02em}
.day .rows{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.row .th{width:44px;aspect-ratio:4/5;background:var(--tile) center/cover;flex:none}
.row small{color:var(--muted);display:block}
.row .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;max-width:420px}
.field label{font-size:12px;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chk{display:flex;gap:10px;align-items:center;margin-bottom:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:99;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Painel lateral do post ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.16);display:flex;justify-content:flex-end;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sp{background:#fff;width:min(460px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.08);animation:slide .2s cubic-bezier(.2,.7,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.sp .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.sp .bar .sp-close{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.sp .bar .sp-close:hover{background:var(--soft)}
.sp .body{padding:20px 22px 34px;display:flex;flex-direction:column;gap:16px}
.sp .ttl{font-size:24px;font-weight:500;letter-spacing:-.02em;border:0;outline:none;width:100%;padding:2px 0;border-radius:6px}
.sp .ttl:focus{background:var(--soft)}
.sp dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px 10px;margin:0;align-items:center;font-size:13px}
.sp dt{color:var(--muted)}
.sp dd{margin:0;min-width:0}
.sp input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--soft)}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.sd{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.st-rascunho{background:#c9c4c4}.st-pronto{background:#f2b01e}.st-agendado{background:#2f45ff}.st-publicado{background:#14b85a}
.sp h3{font-size:13px;font-weight:600;margin:8px 0 -6px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs div{width:56px;aspect-ratio:4/5;background:var(--tile) center/cover;border-radius:3px}
.sp textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;font-size:13px;line-height:1.45;outline:none}
.sp textarea:focus{border-color:#bdbdbd}
.sp .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.saved{font-size:11px;color:var(--muted)}

/* ---------- Admin: GM e administradores (v5) ---------- */
.adm-tabs{display:flex;gap:20px;padding:0 max(16px,2.2vw);border-bottom:1px solid var(--line);font-size:13px;overflow-x:auto;scrollbar-width:none}
.adm-tabs a,.adm-tabs span{padding:12px 0;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:1px solid transparent;margin-bottom:-1px}
.adm-tabs a{cursor:pointer}
.adm-tabs a.cur{color:var(--fg);border-bottom-color:var(--fg)}
.adm-tabs span{color:#b0b0b0}
.adm-tabs span small{font-size:10px;margin-left:4px}
.adm .badge-gm{font-size:11px;border:1px solid var(--fg);border-radius:99px;padding:3px 9px;vertical-align:middle;letter-spacing:0;font-weight:500}
.adm-inv{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--soft);border-radius:12px;padding:12px;margin:0 0 8px}
.adm-inv input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none}
.adm-inv input:focus{border-color:#bdbdbd}
.adm-inv select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.adm-note{font-size:12px;color:var(--muted);margin:0 0 28px}
.adm-list{border-top:1px solid var(--line)}
.adm-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) 110px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.adm-row .who2{display:flex;align-items:center;gap:10px;min-width:0}
.adm-row .who2 .avatar{width:30px;height:30px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600}
.adm-row .nm{display:flex;flex-direction:column;min-width:0}
.adm-row .nm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-row .nm small,.adm-row .mut{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-row .ed{justify-self:end;font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.rd{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:none;vertical-align:middle}
.chip .rd{margin:0}
.chip.on .rd{box-shadow:0 0 0 1.5px #fff}
.r-gm{background:var(--fg)}.r-admin{background:var(--badge)}.r-social_media{background:#14b85a}.r-cliente{background:#f2b01e}
.adm-h2{font-size:13px;font-weight:600;margin:36px 0 10px}
.adm-day{font-size:12px;color:var(--muted);margin:26px 0 4px;font-weight:500}
.adm-log{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.adm-log .t{color:var(--muted);font-size:12px;flex:0 0 42px;font-variant-numeric:tabular-nums}
.adm-log .x{flex:1;min-width:0}
.adm-log .c{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center}
.c-funcoes{background:var(--badge)}.c-usuarios{background:#0ea5e9}.c-conteudo{background:#14b85a}.c-pagamentos{background:#f2b01e}.c-seguranca{background:var(--err)}.c-ver_como_usuario{background:#a855f7}
.role-help{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.pill[disabled]{opacity:.45;cursor:default}
@media (max-width:760px){.nav a[data-go="admin"]{display:none}}
@media (max-width:640px){.adm-row{grid-template-columns:minmax(0,1fr) auto 96px}.adm-row .hide-sm{display:none}.adm-log .c{display:none}}

/* ---------- Cronograma: semana e quadro ---------- */
.cr{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;padding:6px max(16px,2.2vw) 30px;min-height:calc(100vh - 66px)}
.cr-side{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:20px;align-self:start;position:sticky;top:76px}
.cr-side h2{font-size:15px;font-weight:500;margin:0}
.cr-side .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px}
.acc-f{display:flex;flex-direction:column;gap:2px}
.acc-f label{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 6px;border-radius:6px;cursor:pointer;min-width:0}
.acc-f label:hover{background:var(--soft)}
.acc-f input{accent-color:var(--fg);margin:0}
.acc-f .sq{width:12px;height:12px;border-radius:3px;flex:none}
.acc-f .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-f .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.cr-main{background:var(--soft);border-radius:12px;padding:14px;min-width:0}
.cr-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cr-top h2{font-size:17px;font-weight:500;margin:0 6px;letter-spacing:-.01em}
.ib{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#555}
.ib:hover{background:#e4e4e4}
.seg{display:inline-flex;background:#e6e6e6;border-radius:9px;padding:3px;margin-left:auto}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cols{display:grid;gap:8px;overflow-x:auto;padding-bottom:4px}
.cols.week{grid-template-columns:repeat(7,minmax(128px,1fr))}
.cols.board{grid-template-columns:repeat(4,minmax(190px,1fr))}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col .ch{font-size:13px;padding:2px 4px;display:flex;align-items:center;gap:6px;color:#333}
.col .ch b{font-weight:500}
.col .ch.today b{background:var(--fg);color:#fff;border-radius:99px;padding:0 7px}
.col .ch .n{margin-left:auto;color:var(--muted);font-size:12px}
.zone{background:#e8e8e8;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:440px;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.zone.past{background:#ededed}

function traduz(m=''){
  const t=m.toLowerCase();
  if(t.includes('invalid login'))return 'E-mail ou senha incorretos.';
  if(t.includes('email not confirmed'))return 'Confirme seu e-mail antes de entrar. Procure o link na sua caixa de entrada (e no spam).';

  if(t.includes('at least 6')||t.includes('password should'))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(t.includes('rate limit')||t.includes('security purposes'))return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  if(t.includes('valid email')||t.includes('invalid format'))return 'Esse e-mail não parece válido.';

}

async function signPaths(paths){
  const need=[...new Set(paths)].filter(p=>p&&!p.startsWith('picsum:')&&!URLS[p]);if(!need.length)return;
  const {data}=await sb.storage.from('fotos').createSignedUrls(need,60*60*6);

}

const LOGO=(big)=>`<span class="logo ${big?'big':''}" aria-hidden="true">`+'<i></i>'.repeat(9)+'</span>';
const EYE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

let authNote=null; // aviso para mostrar na próxima tela de login (ex.: link expirado)
const BASE_URL=()=>location.protocol.startsWith('http')?location.href.split('#')[0].split('?')[0]:undefined;
function vAuth(mode){
  document.getElementById('toast').hidden=true; // nenhum aviso de dentro do app aparece no login
  const T={entrar:['Bem-vindo de volta',`Digite suas credenciais ou <a data-go="criar">crie uma conta</a>`,'Próximo'],
    criar:['Crie sua conta',`Já tem conta? <a data-go="entrar">Entre aqui</a>`,'Criar conta'],
    senha:['Recuperar senha',`Enviamos um link para você criar uma nova senha. <a data-go="entrar">Voltar</a>`,'Enviar link'],
    'nova-senha':['Crie uma nova senha','Use pelo menos 6 caracteres. Uma frase curta é mais fácil de lembrar.','Salvar senha']}[mode];
  const ph={entrar:'Senha',criar:'Senha (mínimo 6 caracteres)','nova-senha':'Nova senha'}[mode];
  app.innerHTML=`<main class="auth"><section class="auth-l"><div class="top">${LOGO(true)}</div>
    <form class="auth-f" id="af" novalidate>
      <h1>${T[0]}</h1><p class="sub">${T[1]}</p>
      ${mode==='criar'?'<input id="a-name" placeholder="Seu nome" autocomplete="name" aria-label="Seu nome" required>':''}
      ${mode!=='nova-senha'?'<input id="a-email" type="email" placeholder="seu@email.com" autocomplete="email" aria-label="E-mail" required>':''}
      ${mode!=='senha'?`<div class="pw"><input id="a-pass" type="password" placeholder="${ph}" aria-label="${ph}" autocomplete="${mode==='entrar'?'current-password':'new-password'}" required><button type="button" id="eye" aria-label="Mostrar senha">${EYE_OFF}</button></div>`:''}
      ${mode==='nova-senha'?'<input id="a-pass2" type="password" placeholder="Repita a nova senha" aria-label="Repita a nova senha" autocomplete="new-password" required>':''}
      <button class="auth-btn" id="a-go">${T[2]}</button>
      ${mode==='entrar'?'<a class="forgot" data-go="senha">Esqueceu sua senha?</a>':''}
      <div class="msg" id="a-msg" hidden></div>
      <button type="button" class="forgot" id="resend" hidden>Não chegou? Reenviar o e-mail</button>
    </form>
    <div class="auth-word">Fig.Feed</div></section>${authPanel()}</main>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  const eye=document.getElementById('eye');
  if(eye)eye.onclick=()=>{const i=document.getElementById('a-pass');const show=i.type==='password';i.type=show?'text':'password';eye.innerHTML=show?EYE:EYE_OFF;eye.setAttribute('aria-label',show?'Esconder senha':'Mostrar senha')};
  const msg=(t,ok)=>{const m=document.getElementById('a-msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');m.hidden=false};
  (document.getElementById('a-email')||document.getElementById('a-pass')).focus();
  if(authNote&&mode==='entrar'){msg(authNote.t||authNote,authNote.ok);authNote=null}
  const resend=document.getElementById('resend');
  resend.onclick=async()=>{const email=document.getElementById('a-email')?.value.trim();if(!email)return;resend.disabled=true;
    try{const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:BASE_URL()}});if(error)throw error;
      msg(`Enviamos de novo para ${email}. Olhe também a caixa de spam.`,true)}catch(err){msg(traduz(err.message))}
    setTimeout(()=>resend.disabled=false,30000)};
  document.getElementById('af').onsubmit=async e=>{
    e.preventDefault();const btn=document.getElementById('a-go');
    const email=document.getElementById('a-email')?.value.trim();const pass=document.getElementById('a-pass')?.value;
    if(mode==='criar'&&!document.getElementById('a-name').value.trim())return msg('Digite seu nome.');
    if(mode!=='nova-senha'&&!/^\S+@\S+\.\S+$/.test(email||''))return msg('Digite um e-mail válido.');
    if(mode!=='senha'&&(!pass||pass.length<6))return msg('A senha precisa ter pelo menos 6 caracteres.');
    if(mode==='nova-senha'&&pass!==document.getElementById('a-pass2').value)return msg('As duas senhas não são iguais. Digite de novo.');
    btn.disabled=true;const old=btn.textContent;btn.textContent='Aguarde…';
    try{
      if(mode==='entrar'){const {error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error){if(error.message.toLowerCase().includes('email not confirmed'))resend.hidden=false;throw error}}
      if(mode==='criar'){const name=document.getElementById('a-name').value.trim();
        const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name},emailRedirectTo:BASE_URL()}});
        if(error)throw error;
        if(!data.session){msg(`Conta criada! Enviamos um link de confirmação para ${email}. Clique nele para ativar sua conta.`,true);resend.hidden=false;btn.textContent=old;btn.disabled=false;return}}
      if(mode==='senha'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:BASE_URL()});if(error)throw error;
        msg(`Se existir uma conta com ${email}, você vai receber um link para criar uma nova senha.`,true);btn.textContent=old;btn.disabled=false;return}
      if(mode==='nova-senha'){const {error}=await sb.auth.updateUser({password:pass});if(error)throw error;recovery=false;toast('Senha alterada');go('home')}
    }catch(err){msg(traduz(err.message));btn.textContent=old;btn.disabled=false}
  };
}

/* ======================= Arrastar e reorganizar ======================= */
function flip(container,mutate){
  const kids=[...container.children];const before=new Map(kids.map(k=>[k,k.getBoundingClientRect()]));
  mutate();
  kids.forEach(k=>{const a=before.get(k),b=k.getBoundingClientRect();const dx=a.left-b.left,dy=a.top-b.top;
    if(dx||dy){k.style.transition='none';k.style.transform=`translate(${dx}px,${dy}px)`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{k.style.transition='transform .26s cubic-bezier(.2,.7,.2,1)';k.style.transform=''}))}});
}
let dragCleanup=null;
// No toque: segure ~0,3 s para começar a arrastar; deslizar sem segurar continua rolando a tela.
let blockTouch=false;
document.addEventListener('touchmove',e=>{if(blockTouch)e.preventDefault()},{passive:false});
function armTouch(st,el){if(st.touch)st.timer=setTimeout(()=>{st.armed=true;blockTouch=true;el.classList.add('armed');if(navigator.vibrate)navigator.vibrate(12)},320)}
function disarm(st,el){clearTimeout(st.timer);blockTouch=false;el.classList.remove('armed')}
function sortable(container,{onDrop,onClick}){
  dragCleanup&&dragCleanup();let drag=null;
  container.onpointerdown=e=>{const it=e.target.closest('.item');if(!it||e.button>0||e.target.closest('.x'))return;
    drag={it,x:e.clientX,y:e.clientY,started:false,lock:0,pid:e.pointerId,touch:e.pointerType==='touch',armed:e.pointerType!=='touch'};armTouch(drag,it)};
  const move=e=>{
    if(!drag||e.pointerId!==drag.pid)return;
    if(!drag.armed){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){disarm(drag,drag.it);drag=null}return}
    if(!drag.started){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
      drag.started=true;const r=drag.it.getBoundingClientRect();const g=drag.it.cloneNode(true);g.className=drag.it.className+' ghost';g.classList.remove('item');
      Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.appendChild(g);
      drag.g=g;drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;drag.it.classList.add('is-ph')}
    drag.g.style.left=(e.clientX-drag.ox)+'px';drag.g.style.top=(e.clientY-drag.oy)+'px';
    const now=performance.now();if(now<drag.lock)return;
    const under=document.elementFromPoint(e.clientX,e.clientY);const t=under&&under.closest('.item');
    if(!t||t===drag.it||t.parentNode!==container)return;
    const kids=[...container.children];const ti=kids.indexOf(t),pi=kids.indexOf(drag.it);
    flip(container,()=>container.insertBefore(drag.it,ti>pi?t.nextSibling:t));drag.lock=now+170;
  };
  const end=e=>{if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;disarm(d,d.it);
    if(!d.started){if(e.type==='pointerup')onClick&&onClick(d.it.dataset.id);return}
    d.it.classList.remove('is-ph');d.g.remove();onDrop([...container.querySelectorAll(':scope > .item')].map(n=>n.dataset.id))};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
  dragCleanup=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);document.querySelector('.ghost')?.remove()};

  const move=e=>{
    if(!d||e.pointerId!==d.pid)return;
    if(!d.armed){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>8){disarm(d,d.c);d=null}return}
    if(!d.on){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<6)return;d.on=true;const r=d.c.getBoundingClientRect();
      const g=d.c.cloneNode(true);g.classList.add('cardghost');Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px'});
      document.body.appendChild(g);d.g=g;d.ox=e.clientX-r.left;d.oy=e.clientY-r.top;d.c.classList.add('ph')}
    d.g.style.left=(e.clientX-d.ox)+'px';d.g.style.top=(e.clientY-d.oy)+'px';
    const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone');const ok=z&&root.contains(z)?z:null;
    root.querySelectorAll('.zone.over').forEach(x=>{if(x!==ok)x.classList.remove('over')});if(ok&&ok!==d.c.parentNode)ok.classList.add('over');d.z=ok;
    const r=root.getBoundingClientRect();if(e.clientX>r.right-40)root.scrollLeft+=12;else if(e.clientX<r.left+40)root.scrollLeft-=12;
    if(ok){const zr=ok.getBoundingClientRect();if(e.clientY>zr.bottom-40)ok.scrollTop+=12;else if(e.clientY<zr.top+40)ok.scrollTop-=12}
  };
  const end=e=>{if(!d||e.pointerId!==d.pid)return;const x=d;d=null;disarm(x,x.c);
    if(!x.on){if(e.type==='pointerup')onClick(x.c.dataset.a,x.c.dataset.p);return}
    x.g.remove();x.c.classList.remove('ph');root.querySelectorAll('.zone.over').forEach(z=>z.classList.remove('over'));
    if(x.z&&x.z!==x.c.parentNode)onDrop(x.c.dataset.a,x.c.dataset.p,x.z.dataset.z)};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
  dragCleanup=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);document.querySelector('.cardghost')?.remove()};
  root.onkeydown=e=>{const c=e.target.closest('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();onClick(c.dataset.a,c.dataset.p)}};
}

/* ======================= Cronograma: semana e quadro ======================= */
let crView='semana',crWeek=null;const crHidden=new Set();
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS=['seg','ter','qua','qui','sex','sáb','dom'];
const DIAS_LONGOS=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
const monday=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wdIdx=ds=>(new Date(ds+'T12:00').getDay()+6)%7;
const CHEV_L='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>';
const CHEV_R='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>';
function visiblePosts(){const r=[];S.accounts.forEach(a=>{if(!crHidden.has(a.id))a.posts.forEach(p=>r.push({a,p}))});return r}
function cardHTML({a,p},withDate){return `<div class="card" data-a="${a.id}" data-p="${p.id}" tabindex="0" role="button" aria-label="${esc(p.title)}, ${esc(a.handle)}, ${p.date?fmt(p.date):'sem data'}, ${stName(p.status)}">
  <div class="ct"><span class="th" style="${bgi(p.slides[0],70,88)}"></span><span class="tt">${esc(p.title)}</span></div>
  <div class="meta"><span class="tag"><i style="background:${accColor(a)}"></i>${esc(a.handle)}</span>${withDate?`<span style="margin-left:auto;white-space:nowrap">${p.date?fmt(p.date):'sem data'}</span>`:`<i class="sd st-${p.status}" title="${stName(p.status)}" style="margin-left:auto"></i>`}</div></div>`}
function weekLabel(){const a=crWeek,b=addDays(crWeek,6);
  return a.getMonth()===b.getMonth()?`${MESES[a.getMonth()]} ${a.getFullYear()}`:`${MESES[a.getMonth()].slice(0,3)} – ${MESES[b.getMonth()].slice(0,3)} ${b.getFullYear()}`}
function vCrono(){
  if(!crWeek)crWeek=monday(new Date());
  const vis=visiblePosts();const cnt=k=>vis.filter(x=>x.p.status===k).length;
  app.innerHTML=header('crono')+`<main class="cr">
    <aside class="cr-side">
      <div class="desc"><h2>Cronograma</h2><p style="color:var(--muted);font-size:12px;margin:6px 0 0;line-height:1.45">Arraste um cartão (no celular, segure e arraste) para mudar ${crView==='semana'?'o dia da publicação':'o status'}. Clique nele para ver os detalhes.</p></div>
      <div><div class="lbl"><span>Contas</span><span>${S.accounts.length}</span></div><div class="acc-f accs-list">${S.accounts.length?S.accounts.map(a=>`<label><input type="checkbox" data-f="${a.id}" ${crHidden.has(a.id)?'':'checked'}><span class="sq" style="background:${accColor(a)}"></span><span class="nm">${esc(a.handle)}</span><span class="n">${a.posts.length}</span></label>`).join(''):'<span style="font-size:12px;color:var(--muted)">Nenhuma conta ainda.</span>'}</div></div>
      <div class="stblock"><div class="lbl"><span>Status</span></div><div class="acc-f">${STATUS.map(([k,n])=>`<label style="cursor:default"><i class="sd st-${k}"></i>${n}<span class="n">${cnt(k)}</span></label>`).join('')}</div></div>
    </aside>
    <section class="cr-main"><div class="cr-top">
      ${crView==='semana'?`<button class="ib" id="prev" aria-label="Semana anterior">${CHEV_L}</button><button class="ib" id="next" aria-label="Próxima semana">${CHEV_R}</button><h2>${weekLabel()}</h2><button class="pill" id="hoje" style="padding:4px 10px;font-size:12px">Hoje</button>`:'<h2>Quadro de status</h2>'}
      <div class="seg"><button data-v="semana" class="${crView==='semana'?'on':''}" aria-pressed="${crView==='semana'}">Semana</button><button data-v="quadro" class="${crView==='quadro'?'on':''}" aria-pressed="${crView==='quadro'}">Quadro</button></div>
    </div><div id="cols"></div></section></main>`;
  bindHeader();
  app.querySelectorAll('[data-f]').forEach(c=>c.onchange=()=>{c.checked?crHidden.delete(c.dataset.f):crHidden.add(c.dataset.f);vCrono()});
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{crView=b.dataset.v;vCrono()});
  const pv=document.getElementById('prev');
  if(pv){pv.onclick=()=>{crWeek=addDays(crWeek,-7);vCrono()};document.getElementById('next').onclick=()=>{crWeek=addDays(crWeek,7);vCrono()};document.getElementById('hoje').onclick=()=>{crWeek=monday(new Date());vCrono()}}
  renderCols(vis);
}
function renderCols(vis){
  const box=document.getElementById('cols');const today=iso(new Date());
  if(crView==='semana'){
    box.className='cols week';
    box.innerHTML=Array.from({length:7},(_,i)=>{const d=addDays(crWeek,i);const ds=iso(d);const xs=vis.filter(x=>x.p.date===ds);
      return `<div class="col"><div class="ch ${ds===today?'today':''}"><b>${d.getDate()}</b>${DIAS[i]}<span class="n">${xs.length||''}</span></div>
        <div class="zone ${ds<today?'past':''}" data-z="${ds}">${xs.map(x=>cardHTML(x,false)).join('')}</div></div>`}).join('');
  }else{
    box.className='cols board';
    box.innerHTML=STATUS.map(([k,n])=>{const xs=vis.filter(x=>x.p.status===k).sort((m,o)=>(m.p.date||'9').localeCompare(o.p.date||'9'));
      return `<div class="col"><div class="ch"><i class="sd st-${k}"></i><b>${n}</b><span class="n">${xs.length}</span></div>
        <div class="zone" data-z="${k}">${xs.map(x=>cardHTML(x,true)).join('')}</div></div>`}).join('');
  }
  cardDrag(box,{onClick:(aid,pid)=>openPanel(aid,pid,()=>{if(route[0]==='crono')vCrono()}),
    onDrop:async(aid,pid,z)=>{const p=accById(aid)?.posts.find(x=>x.id===pid);if(!p)return;const week=crView==='semana';
      if(week)p.date=z;else p.status=z;vCrono();
      try{await db(sb.from('posts').update(week?{publish_date:z}:{status:z}).eq('id',pid));toast(week?`Movido para ${DIAS_LONGOS[wdIdx(z)]}, ${fmt(z)}`:`Status: ${stName(z)}`)}
      catch(e){await loadAll();vCrono()}}});
}

/* ======================= Perfil com quadro de constância ======================= */
let heatAcc='';
function showTip(el,text){let t=document.getElementById('tip');if(!t){t=document.createElement('div');t.id='tip';t.className='tip';t.setAttribute('role','tooltip');document.body.appendChild(t)}
  t.textContent=text;const r=el.getBoundingClientRect();t.style.left=Math.max(8,Math.min(innerWidth-t.offsetWidth-8,r.left+r.width/2-t.offsetWidth/2))+'px';t.style.top=Math.max(8,r.top-t.offsetHeight-8)+'px'}
function hideTip(){document.getElementById('tip')?.remove()}
function vPerfil(){
  const today=iso(new Date());const map={};
  S.accounts.forEach(a=>{if(heatAcc&&heatAcc!==a.id)return;a.posts.forEach(p=>{if(!p.date)return;const past=p.date<=today;
    const ok=past?(p.status==='publicado'||p.status==='agendado'):p.status!=='rascunho';if(ok)(map[p.date]=map[p.date]||[]).push({a,p})})});
  const start=addDays(monday(new Date()),-52*7),weeks=61,startIso=iso(start);
  let total=0,fut=0;Object.entries(map).forEach(([d,xs])=>{if(d<=today&&d>=startIso)total+=xs.length;if(d>today)fut+=xs.length});
  let cols='<div class="wk"><span class="mo"></span>'+['seg','','qua','','sex','',''].map(w=>`<span class="wd">${w}</span>`).join('')+'</div>';
  for(let w=0;w<weeks;w++){const ws=addDays(start,w*7);let mo=w===0?MESES[ws.getMonth()].slice(0,3):'';let cells='';
    for(let i=0;i<7;i++){const d=addDays(ws,i);const ds=iso(d);if(d.getDate()===1&&w>0)mo=MESES[d.getMonth()].slice(0,3);
      const n=(map[ds]||[]).length;const f=ds>today;
      const cls=f?`fut ${n>=2?'f2':n?'f1':''}`:(n>=4?'l4':n===3?'l3':n===2?'l2':n?'l1':'');
      cells+=`<span class="cell ${cls} ${ds===today?'today':''}" data-d="${ds}"></span>`}
    cols+=`<div class="wk"><span class="mo">${mo}</span>${cells}</div>`}
  const wkHas=w=>{for(let i=0;i<7;i++){const ds=iso(addDays(w,i));if(ds<=today&&map[ds])return true}return false};
  let streak=0,w=monday(new Date());if(!wkHas(w))w=addDays(w,-7);while(streak<520&&wkHas(w)){streak++;w=addDays(w,-7)}
  const from13=iso(addDays(new Date(),-91));let c13=0;Object.entries(map).forEach(([d,xs])=>{if(d<=today&&d>from13)c13+=xs.length});
  const avg=(c13/13).toFixed(1).replace('.',',');
  const wdC=[0,0,0,0,0,0,0];Object.entries(map).forEach(([d,xs])=>{if(d<=today)wdC[wdIdx(d)]+=xs.length});
  const mx=Math.max(...wdC);const best=mx?DIAS_LONGOS[wdC.indexOf(mx)]:'—';
  app.innerHTML=header('')+`<main class="page" style="max-width:920px">
    <div class="prof-top"><button class="avbtn" id="pav" aria-label="Trocar foto de perfil"><span class="avatar" style="${bgi(profAv(),168,168)}"></span><span class="lb">trocar</span></button>
      <div style="min-width:0"><h1>${esc(S.profile.name||'Seu perfil')}</h1><p class="sub" style="margin:4px 0 0">${esc([S.profile.handle,USER.email].filter(Boolean).join(' · '))}</p></div></div>
    <section class="heat-wrap" aria-label="Quadro de constância">
      <div class="heat-head"><h2>${total} ${total===1?'post publicado':'posts publicados'} no último ano</h2>
        <select id="hacc" aria-label="Filtrar por conta"><option value="">Todas as contas</option>${S.accounts.map(a=>`<option value="${a.id}" ${heatAcc===a.id?'selected':''}>${esc(a.handle)}</option>`).join('')}</select></div>
      <div class="heat-scroll" id="hs"><div class="heat" id="heat">${cols}</div></div>
      <div class="heat-foot"><span style="margin-right:auto">${fut} ${fut===1?'post agendado':'posts agendados'} pela frente</span>Menos <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> Mais<span class="sep"></span><span class="cell fut f1"></span> Agendado</div>
    </section>
    <div class="stats"><div><b>${streak}</b><span>${streak===1?'semana seguida':'semanas seguidas'} com post</span></div>
      <div><b>${avg}</b><span>posts por semana (últimos 3 meses)</span></div>
      <div><b style="text-transform:capitalize">${best}</b><span>dia da semana em que mais publica</span></div></div>
    <h2 class="sec">Seus dados</h2>
    <form id="pf"><div class="field"><label for="pn">Nome</label><input id="pn" value="${esc(S.profile.name)}"></div>
      <div class="field"><label for="ph">Seu @</label><input id="ph" value="${esc(S.profile.handle)}" placeholder="@seu.perfil"></div>
      <button class="pill dark">Salvar</button></form></main>`;
  bindHeader();
  const hs=document.getElementById('hs');hs.scrollLeft=hs.scrollWidth;
  const heat=document.getElementById('heat');
  heat.onmouseover=e=>{const c=e.target.closest('[data-d]');if(!c)return hideTip();const ds=c.dataset.d;const xs=map[ds]||[];const n=xs.length;const f=ds>today;
    const hs2=[...new Set(xs.map(x=>x.a.handle))].join(', ');
    showTip(c,`${DIAS_LONGOS[wdIdx(ds)]}, ${fmt(ds)} · ${n?`${n} post${n>1?'s':''} ${f?'agendado':'publicado'}${n>1?'s':''}`:'nenhum post'}${hs2?' · '+hs2:''}`)};
  heat.onmouseleave=hideTip;
  heat.onclick=e=>{const c=e.target.closest('[data-d]');if(!c)return;hideTip();crWeek=monday(new Date(c.dataset.d+'T12:00'));crView='semana';go('crono')};
  document.getElementById('hacc').onchange=e=>{heatAcc=e.target.value;vPerfil()};
  document.getElementById('pav').onclick=()=>pickFiles({type:'profavatar'});
  document.getElementById('pf').onsubmit=async e=>{e.preventDefault();let h=document.getElementById('ph').value.trim();if(h&&h[0]!=='@')h='@'+h;
    const name=document.getElementById('pn').value.trim();await db(sb.from('profiles').update({name,handle:h}).eq('id',USER.id));
    S.profile.name=name;S.profile.handle=h;toast('Perfil salvo');vPerfil()};
}

let ADM={users:[],invites:[],log:[],filter:'todos',cat:'todos',loaded:false};
const dBR=x=>new Date(x).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});

async function admLoad(){

function admUsuarios(){

async function setAvatar(ctx,file){
  toast('Enviando foto…',15000);const b=await shrink(file);if(!b){toast('Não deu para ler essa imagem.');return}
  const path=`${USER.id}/${ctx.type==='profavatar'?'perfil':'contas'}/${crypto.randomUUID()}.jpg`;
  const {error}=await sb.storage.from('fotos').upload(path,b,{contentType:'image/jpeg'});if(error){toast(traduz(error.message));return}
  let old;
  if(ctx.type==='profavatar'){old=S.profile.avatar_path;await db(sb.from('profiles').update({avatar_path:path}).eq('id',USER.id));S.profile.avatar_path=path}
  else{const a=accById(ctx.acc);old=a.avatar;await db(sb.from('accounts').update({avatar_path:path}).eq('id',a.id));a.avatar=path}
  if(old)sb.storage.from('fotos').remove([old]);
  await signPaths([path]);toast('Foto atualizada');render();
}

/* ======================= Envio de fotos ======================= */
let pickCtx=null;
function pickFiles(ctx){pickCtx=ctx;const f=document.getElementById('file');f.value='';f.click()}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.85)};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
async function uploadSlides(p,files){
  const room=10-p.slides.length;if(files.length>room)toast(`Só cabem mais ${room} foto(s) neste post`);
  files=files.slice(0,Math.max(0,room));if(!files.length)return;
  toast(`Enviando ${files.length} foto(s)…`,20000);
  const blobs=(await Promise.all(files.map(shrink))).filter(Boolean);const rows=[];
  for(const b of blobs){const path=`${USER.id}/${p.id}/${crypto.randomUUID()}.jpg`;
    const {error}=await sb.storage.from('fotos').upload(path,b,{contentType:'image/jpeg'});if(error){toast(traduz(error.message));continue}
    rows.push({post_id:p.id,storage_path:path,credit:(S.profile.handle||'').replace('@','')||null,position:p.slides.length+rows.length})}
  if(!rows.length)return;
  const ins=await db(sb.from('slides').insert(rows).select('id,storage_path,credit'));
  await signPaths(ins.map(r=>r.storage_path));
  p.slides.push(...ins.map(r=>({id:r.id,path:r.storage_path,credit:r.credit})));toast('Fotos enviadas');
}
document.getElementById('file').onchange=async e=>{
  const files=[...e.target.files];if(!files.length||!pickCtx)return;
  if(pickCtx.type==='profavatar'||pickCtx.type==='accavatar'){try{await setAvatar(pickCtx,files[0])}catch(err){}return}
  if(pickCtx.type==='stories'){const c=pickCtx;toast(`Enviando ${files.length} ${files.length===1?'story':'stories'}…`,60000);const rows=[];
    for(const f of files){const b=await shrink(f);if(!b)continue;const path=`${USER.id}/stories/${crypto.randomUUID()}.jpg`;
      const {error}=await sb.storage.from('fotos').upload(path,b,{contentType:'image/jpeg'});if(error){toast(traduz(error.message));continue}
      rows.push({account_id:c.acc,story_date:c.day,storage_path:path,credit:(S.profile.handle||'').replace('@','')||null,position:c.n+rows.length})}
    if(rows.length){await db(sb.from('stories').insert(rows));toast(`${rows.length} ${rows.length===1?'story enviado':'stories enviados'}`)}
    if(route[0]==='stories')vStories();return}
  if(pickCtx.type==='biblioteca'){toast(`Enviando ${files.length} ${files.length===1?'foto':'fotos'}…`,60000);let ok=0;
    for(const f of files){const b=await shrink(f);if(!b)continue;
      const {error}=await sb.storage.from('fotos').upload(`${USER.id}/biblioteca/${crypto.randomUUID()}.jpg`,b,{contentType:'image/jpeg'});
      if(error){toast(traduz(error.message));continue}ok++}
    toast(ok?`${ok} ${ok===1?'foto enviada':'fotos enviadas'}`:'Nenhuma foto foi enviada');libFilter='sem-uso';if(route[0]==='biblioteca')vBiblioteca();return}
  const a=accById(pickCtx.acc);if(!a)return;
  try{
    if(pickCtx.type==='newpost'){const p=await createPost(a);await uploadSlides(p,files);go(`car/${a.id}/${p.id}`)}
    else{const p=a.posts.find(x=>x.id===pickCtx.post);await uploadSlides(p,files);vCar()}
  }catch(err){}
};

async function applyTemplate(acc,t){
  const top=acc.posts[0]?.date;const base=top?new Date(top+'T12:00'):new Date();
  const day=k=>{const d=new Date(base);d.setDate(d.getDate()+k);return iso(d)};
  let rows;
  if(t.tipo==='carrossel')rows=[{account_id:acc.id,title:t.name,caption:'',publish_date:day(top?2:0),position:0,formato:'carrossel'}];
  else{const ss=t.slots.filter(s=>s!=='vazio');const n=ss.length;
    rows=ss.map((s,i)=>({account_id:acc.id,title:s==='foto'?'Post com foto':'Post de texto',caption:'',publish_date:day(2*(n-i)-(top?0:2)),position:i,formato:s==='foto'?'foto':null}))}
  const ins=await db(sb.from('posts').insert(rows).select('id,title,caption,publish_date,status,position,formato'));
  ins.sort((a,b)=>a.position-b.position);
  acc.posts.unshift(...ins.map(r=>({id:r.id,title:r.title,caption:r.caption,date:r.publish_date,status:r.status,pilar:'',formato:r.formato||null,hora:null,cta:'',slides:[]})));
  await db(sb.rpc('reorder_posts',{p_account:acc.id,p_ids:acc.posts.map(x=>x.id)}));
}

    case 'link':{const u=safeUrl(b.url);if(!u)return '';let host='';try{host=new URL(u).hostname.replace(/^www\./,'')}catch(e){}
      return `<a class="bl-link" href="${esc(u)}" target="_blank" rel="noopener"><b>${esc(b.titulo||host||u)}</b>${b.desc?`<span>${esc(b.desc)}</span>`:''}<small>${esc(host)}</small></a>`}

async function saveBlog(){
  const b=BE;if(!b.title.trim())return toast('Escreva um título.');
  b.slug=slugify(b.slug||b.title);if(!b.slug)return toast('Escolha um endereço para o post.');
  if(b.status==='agendado'&&!b.publish_at)return toast('Escolha a data e a hora do agendamento.');
  const agora=new Date().toISOString();
  const publish_at=b.status==='publicado'?(b.publish_at&&b.publish_at<=agora?b.publish_at:agora):b.publish_at;
  const row={slug:b.slug,title:b.title.trim(),subtitle:(b.subtitle||'').trim(),categoria:b.categoria,cover_path:b.cover_path,cover_format:b.cover_format,blocks:b.blocks,
    resumo:(b.resumo||'').trim(),status:b.status,publish_at,visibilidade:b.visibilidade,em_novidades:!!b.em_novidades,updated_at:agora};
  const btn=document.getElementById('be-save');if(btn)btn.disabled=true;
  const {data,error}=await (b.id?sb.from('blog_posts').update(row).eq('id',b.id).select('id').single():sb.from('blog_posts').insert(row).select('id').single());
  if(btn)btn.disabled=false;
  if(error){toast(error.code==='23505'||/duplicate/i.test(error.message)?'Já existe um post com esse endereço. Troque o endereço do post.':traduz(error.message),4200);return}
  b.id=data.id;b.publish_at=publish_at;b.slugMan=true;
  admLog('conteudo','salvou post do blog',{titulo:row.title,status:row.status});
  toast({rascunho:'Rascunho salvo',agendado:'Post agendado',publicado:'Post publicado'}[b.status]);
  history.replaceState(null,'','#admin/blog/'+b.id);route=['admin','blog',b.id];drawBlogEditor();
}

let ASS={filter:'todos',coupons:[]};
const ORIGEM={manual:'Liberado à mão',teste:'Teste grátis',cupom:'Cupom'};
const emTeste=u=>planoEf(u)!=='gratis'&&['teste','cupom'].includes(u.plano_origem);
async function admAssinaturas(){
  const h=location.hash;admLoading('assinaturas');
  try{await admLoad();ASS.coupons=await db(sb.from('coupons').select('*').order('created_at',{ascending:false}))}catch(e){return}
  if(stillHere(h))drawAssinaturas();
}
function drawAssinaturas(){
  const us=ADM.users;const f=ASS.filter;
  const match=u=>f==='todos'||(f==='vencidos'?planoVencido(u):f==='teste'?emTeste(u):planoEf(u)===f);
  const val=u=>planoVencido(u)?`<span style="color:var(--err)">${PLANO_NOME[u.plano]} venceu em ${dBR(u.plano_ate)}</span>`:planoEf(u)==='gratis'?'—':u.plano_ate?'até '+dBR(u.plano_ate):'sem prazo';
  const cupSt=c=>!c.ativo?'Pausado':c.expira_em&&new Date(c.expira_em)<new Date()?'Vencido':c.max_usos&&c.usos>=c.max_usos?'Esgotado':'Ativo';
  admShell('assinaturas',`<div class="adm-head"><div><h1>Assinaturas</h1><p class="sub">Quem está em cada plano e até quando.</p></div></div>
    <div class="warn-s">A cobrança automática ainda não está ligada. Por enquanto você libera planos à mão, dá testes grátis e cria cupons. Os limites de cada plano também ainda não são aplicados.</div>
    <section class="adm-stats" aria-label="Resumo"><div><b>${us.filter(u=>planoEf(u)==='pro').length}</b><span>no Pro</span></div><div><b>${us.filter(u=>planoEf(u)==='agencia').length}</b><span>na Agência</span></div>
      <div><b>${us.filter(emTeste).length}</b><span>em teste ou cupom</span></div><div><b>${us.filter(planoVencido).length}</b><span>com plano vencido</span></div></section>
    ${chipsHTML([['todos','Todos'],['gratis','Grátis'],['pro','Pro'],['agencia','Agência'],['teste','Em teste'],['vencidos','Vencidos']],f,'data-f')}
    <div class="adm-list" style="margin-top:16px">${us.filter(match).map(u=>`<div class="adm-row">
      <div class="who2"><span class="avatar" style="background:${initialColor(u.email)}" aria-hidden="true">${esc((u.name||u.email||'?').trim()[0]?.toUpperCase()||'?')}</span><div class="nm"><b>${esc(u.name||u.handle||u.email)}${u.id===USER.id?' (você)':''}</b>${u.name||u.handle?`<small>${esc(u.email)}</small>`:''}</div></div>
      <span><span class="pl-tag ${planoEf(u)}">${PLANO_NOME[planoEf(u)]}</span></span>
      <span class="mut hide-sm">${val(u)}${planoEf(u)!=='gratis'&&ORIGEM[u.plano_origem]?` · ${ORIGEM[u.plano_origem]}`:''}</span>
      <button class="ed" data-u="${u.id}">Mudar plano</button></div>`).join('')||'<p class="sub" style="margin:18px 0">Ninguém aqui.</p>'}</div>
    <h2 class="adm-h2" style="margin-top:48px">Cupons</h2>
    <form class="cup-new" id="cup-n" novalidate>
      <label class="lbl-s">Código<input class="field" id="cn-c" maxlength="30" placeholder="BEMVINDO" autocomplete="off"></label>
      <label class="lbl-s">Plano<select class="field" id="cn-p"><option value="pro">Pro</option><option value="agencia">Agência</option></select></label>
      <label class="lbl-s">Dias grátis<input class="field" id="cn-d" type="number" min="1" max="365" value="30"></label>
      <label class="lbl-s">Máx. de usos<input class="field" id="cn-m" type="number" min="1" placeholder="Sem limite"></label>
      <label class="lbl-s">Vale até<input class="field" id="cn-e" type="date"></label>
      <label class="lbl-s cn-desc">Descrição (só para você)<input class="field" id="cn-t" maxlength="120" placeholder="Ex.: 1º mês grátis no Pro"></label>
      <button class="pill dark">Criar cupom</button></form>
    <div class="adm-list" style="margin-top:18px">${ASS.coupons.map(c=>`<div class="adm-row cup-row"><div class="nm"><b class="mono">${esc(c.code)}</b><small>${esc(c.descricao||'')}</small></div>
      <span>${PLANO_NOME[c.plano]} · ${c.dias} dias</span><span class="mut hide-sm">${c.usos}${c.max_usos?'/'+c.max_usos:''} ${c.usos===1?'uso':'usos'} · ${cupSt(c)}${c.expira_em?' · até '+dBR(c.expira_em):''}</span>
      <span class="cup-acts"><button class="ed" data-tog="${esc(c.code)}">${c.ativo?'Pausar':'Ativar'}</button>${c.usos?'':`<button class="ed" data-del="${esc(c.code)}" style="color:var(--err)">Apagar</button>`}</span></div>`).join('')
      ||'<p class="sub" style="margin:14px 0">Nenhum cupom ainda. O usuário usa o cupom na página Planos.</p>'}</div>`,1080);
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ASS.filter=b.dataset.f;drawAssinaturas()});
  app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>admPlanPanel(ADM.users.find(u=>u.id===b.dataset.u)));
  app.querySelectorAll('[data-tog]').forEach(b=>b.onclick=async()=>{const c=ASS.coupons.find(x=>x.code===b.dataset.tog);b.disabled=true;
    try{await db(sb.from('coupons').update({ativo:!c.ativo}).eq('code',c.code));admLog('pagamentos',c.ativo?'pausou cupom':'ativou cupom',{cupom:c.code});admAssinaturas()}catch(e){b.disabled=false}});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm(`Apagar o cupom ${b.dataset.del}?`))return;
    try{await db(sb.from('coupons').delete().eq('code',b.dataset.del));admLog('pagamentos','apagou cupom',{cupom:b.dataset.del});admAssinaturas()}catch(e){}});
  document.getElementById('cup-n').onsubmit=async e=>{e.preventDefault();
    const code=document.getElementById('cn-c').value.trim().toUpperCase().replace(/\s+/g,'');const dias=+document.getElementById('cn-d').value;
    const max=document.getElementById('cn-m').value;const exp=document.getElementById('cn-e').value;
    if(!/^[A-Z0-9_-]{3,30}$/.test(code))return toast('Use de 3 a 30 letras ou números no código, sem espaço nem acento.',3800);
    if(!(dias>=1&&dias<=365))return toast('Os dias grátis precisam ser entre 1 e 365.');
    const row={code,plano:document.getElementById('cn-p').value,dias,max_usos:max?+max:null,expira_em:exp?new Date(exp+'T23:59:59').toISOString():null,descricao:document.getElementById('cn-t').value.trim()};
    const {error}=await sb.from('coupons').insert(row);
    if(error)return toast(error.code==='23505'?'Já existe um cupom com esse código.':traduz(error.message),3800);
    admLog('pagamentos','criou cupom',{cupom:code,plano:row.plano,dias});toast('Cupom criado');admAssinaturas()};
}
function admPlanPanel(u){
  if(!u)return;closePanel();let pl=planoEf(u),dias=null,outro=false;
  const ov=document.createElement('div');ov.className='ov';ov.id='ov';ov.onclick=e=>{if(e.target===ov)closePanel()};
  const draw=()=>{ov.innerHTML=`<aside class="sp" role="dialog" aria-modal="true" aria-labelledby="pp-t"><div class="bar"><span class="saved">Mudar plano</span><button class="sp-close" id="pp-x" aria-label="Fechar">${XICON}</button></div>
    <div class="body"><div><div class="ttl" id="pp-t" style="font-size:22px">${esc(u.name||u.handle||u.email)}</div><span class="saved">${esc(u.email)} · hoje: ${PLANO_NOME[planoEf(u)]}${planoEf(u)!=='gratis'?(u.plano_ate?' até '+dBR(u.plano_ate):' sem prazo'):''}</span></div>
      <h3>Plano</h3><div class="chips" role="radiogroup" aria-label="Plano">${['gratis','pro','agencia'].map(p=>`<button class="chip ${pl===p?'on':''}" role="radio" aria-checked="${pl===p}" data-p="${p}">${PLANO_NOME[p]}</button>`).join('')}</div>
      ${pl==='gratis'?'<p class="role-help">A pessoa volta para o plano Grátis na hora.</p>':`<h3>Por quanto tempo</h3><div class="chips" role="radiogroup" aria-label="Prazo">${[[null,'Sem prazo'],[7,'7 dias'],[14,'14 dias'],[30,'30 dias'],['outro','Outro']].map(([d,n])=>{const on=d==='outro'?outro:(!outro&&dias===d);return `<button class="chip ${on?'on':''}" role="radio" aria-checked="${on}" data-d="${d}">${n}</button>`}).join('')}</div>
        ${outro?`<label class="lbl-s" for="pp-n">Quantos dias</label><input class="field" id="pp-n" type="number" min="1" max="730" value="${dias||60}">`:''}
        <p class="role-help">${dias||outro?'Quando o prazo acabar, a pessoa volta para o Grátis sozinha.':'Fica liberado até você mudar de novo.'}</p>`}
      <div class="foot"><button class="pill dark" id="pp-save">Salvar plano</button><button class="pill" id="pp-c">Cancelar</button></div>
      <p class="role-help">A mudança fica registrada em Atividade.</p></div></aside>`;
    ov.querySelector('#pp-x').onclick=closePanel;ov.querySelector('#pp-c').onclick=closePanel;
    ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pl=b.dataset.p;draw();ov.querySelector('[data-p].on')?.focus()});
    ov.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d;outro=d==='outro';dias=outro?(dias||60):(d==='null'?null:+d);draw();ov.querySelector('[data-d].on')?.focus()});
    ov.querySelector('#pp-save').onclick=async()=>{const s=ov.querySelector('#pp-save');
      let d=pl==='gratis'?null:(outro?+ov.querySelector('#pp-n').value:dias);
      if(outro&&!(d>=1&&d<=730))return toast('Escolha entre 1 e 730 dias.');
      s.disabled=true;try{await db(sb.rpc('admin_set_plan',{target:u.id,novo_plano:pl,dias:d}));closePanel();
        toast(`${u.name||u.email} agora está no ${PLANO_NOME[pl]}${d?` por ${d} dias`:''}`,3400);
        if(u.id===USER.id)S.profile=await db(sb.from('profiles').select('*').eq('id',USER.id).single());await admLoad();drawAssinaturas()}catch(e){s.disabled=false}}};
  draw();document.body.appendChild(ov);document.addEventListener('keydown',panelEsc);ov.querySelector('[data-p].on')?.focus();
}

function uaName(ua=''){
